     ±12px 随机错位（防同点视觉重叠吞辨识，spec 5.4.3 场景 1） */
  function rollEnemyDrops(e) {
    const off = CONFIG.drops.mate.spawnOffset;
    const jx = function () { return Utils.rand(-off, off); };
    /* 路径 1：既有小型增益（类型掉落率，池仅 7 种常规，排除秒杀） */
    if (Math.random() < e.def.dropRate) {
      const type = commonBuffTypes[Utils.randInt(0, commonBuffTypes.length - 1)];
      World.spawnDrop(e.x + jx(), e.y + jx(), 'buff', 'small', type);
    }
    /* 路径 2：经验球（10%，独立判定，spec 5.3.1 规则 1） */
    if (Math.random() < CONFIG.drops.expOrb.dropRate) {
      World.spawnDrop(e.x + jx(), e.y + jx(), 'exp', null, null);
    }
    /* 路径 3：血包（1%，独立判定，spec 5.4.1 规则 1） */
    if (Math.random() < CONFIG.drops.healPack.dropRate) {
      World.spawnDrop(e.x + jx(), e.y + jx(), 'heal', null, null);
    }
    /* 路径 4：隐藏武器拳套（0.01%，独立判定，spec 5.2.1 规则 1/6——无保底无跨击杀累积） */
    if (Math.random() < CONFIG.drops.gauntlet.enemyDropRate) {
      World.spawnDrop(e.x + jx(), e.y + jx(), 'gauntlet', null, 'gauntlet');
    }
    /* 路径 5：隐藏武器神弓（0.1%，独立判定，bow_staff_lifesteal spec 5.1.1 规则 1） */
    if (Math.random() < CONFIG.drops.bow.enemyDropRate) {
      World.spawnDrop(e.x + jx(), e.y + jx(), 'bow', null, 'bow');
    }
    /* 路径 6：隐藏武器法杖（0.1%，独立判定，spec 5.1.1 规则 1） */
    if (Math.random() < CONFIG.drops.staff.enemyDropRate) {
      World.spawnDrop(e.x + jx(), e.y + jx(), 'staff', null, 'staff');
    }
    /* 路径 7：吸血增益（0.5%，独立判定，small 档——复用既有 buff 通道与 applyBuff 全链路，spec 5.6.1 规则 2） */
    if (Math.random() < CONFIG.drops.lifesteal.enemyDropRate) {
      World.spawnDrop(e.x + jx(), e.y + jx(), 'buff', 'small', 'lifesteal');
    }
  }
  /* Boss 必定掉落武器（高品质增益改为二选一界面发放，spec 5.2.1 规则 1/2） */
  function spawnBossWeaponDrop(b) {
    const pool = CONFIG.drops.weaponPool;
    const wid = pool[Utils.randInt(0, pool.length - 1)];
    World.spawnDrop(b.x, b.y, 'weapon', 'high', wid);
  }

  /* 每帧拾取判定：进入 1.5× 拾取半径先吸附飘移，进入拾取半径正式结算 */
  function update(dt, player) {
    const drops = World.drops;
    const magnetR = player.pickupRadius * CONFIG.player.magnetFactor;
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.bobT += dt * 3;
      const dsq = Utils.distSq(player.x, player.y, d.x, d.y);
      if (dsq < player.pickupRadius * player.pickupRadius) {
        drops[i] = drops[drops.length - 1]; drops.pop(); // swap-remove 后再结算
        if (d.kind === 'buff') applyBuff(player, d.tier, d.payload);
        else if (d.kind === 'weapon') pickupWeapon(player, d.payload);
        else if (d.kind === 'gauntlet') pickupWeapon(player, d.payload); // 拳套完全复用既有武器拾取通道（决策 D13）
        else if (d.kind === 'bow') pickupWeapon(player, d.payload);     // 神弓同构复用（bow_staff_lifesteal D11）
        else if (d.kind === 'staff') pickupWeapon(player, d.payload);   // 法杖同构复用（D11）
        else if (d.kind === 'exp') { // 经验球：累加经验并触发升级结算（死亡守卫在 gainExp 内）
          GAME.AudioSys.play('expOrb');
          GAME.UI.showToast('获得经验 +' + CONFIG.growth.expOrbValue, 'buff');
          GAME.Growth.gainExp(player, CONFIG.growth.expOrbValue);
        } else if (d.kind === 'heal') { // 血包：立即回复 30% 最大生命并封顶（满血拾取流程正常完成、数值不变）
          player.hp = Math.min(player.hp + player.maxHp * CONFIG.drops.healPack.healRatio, player.maxHp);
          GAME.AudioSys.play('heal');
          GAME.UI.showToast('获得血包', 'buff');
        } else if (d.kind === 'mate') { // 队友掉落：随机类型入场（增益型/战斗型，spec 5.5.1 规则 2）
          GAME.Mates.add(player);
        } else {
          console.warn('未知掉落物类型: ' + d.kind); // 未知 kind 安全跳过
        }
      } else if (dsq < magnetR * magnetR) {
        /* 吸附动画：向玩家加速飘移 */
        const dist = Math.sqrt(dsq) || 1;
        const sp = Math.max(120, (magnetR - dist) * 6);
        d.x += (player.x - d.x) / dist * sp * dt;
        d.y += (player.y - d.y) / dist * sp * dt;
      }
    }
  }

  /* 数值格式化：百分比分支保留 1 位小数（0.001→"0.1%"、0.12→"12%"，为秒杀 +0.1% 显示铺路） */
  function fmt(val, pct) {
    if (pct) {
      const v = Math.round(val * 1000) / 10; // 0.001→0.1；0.12→12
      return (v % 1 === 0 ? String(v) : v.toFixed(1)) + '%';
    }
    return val % 1 === 0 ? String(val) : val.toFixed(1);
  }

  /* 增益生效：层数+1 → 由累计数值全量重算修正系数（防增量漂移）→ UI 更新 */
  function applyBuff(player, tier, type) {
    const def = CONFIG.drops.buffs[type];
    if (!def) { console.warn('未知增益类型: ' + type); return; }
    const val = def[tier];
    const st = player.buffStacks[type] || (player.buffStacks[type] = { count: 0, value: 0 });
    st.count++; st.value += val;
    recalc(player);
    GAME.AudioSys.play('pickup');
    GAME.UI.showToast('获得 ' + def.name + ' +' + fmt(val, def.pct), 'buff');
    GAME.UI.refreshBuffs(player);
  }

  /* 全量重算引擎：buff + levelBonus + mateBonus 三源求和后统一软上限钳制（防增量漂移）；
     新来源字段缺失按 0 归一容错（spec 6.1.4 叠加后仍受既有软上限约束） */
  function recalc(player) {
    const caps = CONFIG.drops.caps, bs = player.buffStacks;
    const lb = player.levelBonus || { atk: 0, aspd: 0, speed: 0, maxhp: 0 };
    const mb = player.mateBonus || { atk: 0, aspd: 0, speed: 0, maxhp: 0 };
    player.atkMul = Math.min(1 + (bs.atk ? bs.atk.value : 0) + lb.atk + mb.atk, caps.atk);
    player.aspdMul = Math.min(1 + (bs.aspd ? bs.aspd.value : 0) + lb.aspd + mb.aspd, caps.aspd);
    player.speedMul = Math.min(1 + (bs.speed ? bs.speed.value : 0) + lb.speed + mb.speed, caps.speed);
    player.critRate = Math.min(bs.crit ? bs.crit.value : 0, caps.crit);
    /* 秒杀概率：与 critRate 同构的线性累加 + 软上限钳制（spec 6.3.1，上限 10% 为决策 D） */
    player.instantKillRate = Math.min(bs.instantKill ? bs.instantKill.value : 0, caps.instantKill);
    /* 吸血比例：同构线性累加 + 软上限 30% 钳制（bow_staff_lifesteal spec 6.6.3；lifestealRate 恒被
       全量重算赋值——startRun 初始化 0、每次增益变化刷新，无增量漂移） */
    player.lifestealRate = Math.min(bs.lifesteal ? bs.lifesteal.value : 0, caps.lifesteal);
    player.regen = bs.regen ? bs.regen.value : 0;
    player.pickupRadius = Math.min(CONFIG.player.pickupRadius + (bs.pickup ? bs.pickup.value : 0), caps.pickup);
    /* 最大生命特例：buffHpAdded 语义扩展为"全部非基础来源（增益+升级+队友）已入账量"，
       上限提升同步等量当前生命（满血拾取无异常） */
    const targetAdd = (bs.maxhp ? bs.maxhp.value : 0) + lb.maxhp + mb.maxhp;
    const add = targetAdd - player.buffHpAdded;
    if (add !== 0) {
      player.maxHp += add;
      player.hp = Math.min(player.hp + add, player.maxHp);
      player.buffHpAdded = targetAdd;
    }
  }

  /* 武器掉落拾取：空槽直接入槽（冷却从满值开始）；双持则请求替换界面 */
  function pickupWeapon(player, wid) {
    const def = CONFIG.weapons[wid];
    if (!def) { console.warn('未知武器: ' + wid); return; }
    GAME.AudioSys.play(def.hidden ? (def.sfxGet || 'gauntletGet') : 'pickup'); // 隐藏武器专属音效（D15 缺省键：bow/staff 各配 sfxGet，拳套向后兼容）
    let empty = -1;
    for (let i = 0; i < player.slots.length; i++) { if (!player.slots[i]) { empty = i; break; } }
    if (empty >= 0) {
      player.slots[empty] = { def: def, cooldownT: def.cooldown };
      GAME.Game.addUsedWeapon(wid);
      GAME.UI.showToast(def.hidden ? '获得隐藏武器：' + def.name : '获得武器：' + def.name, 'buff'); // 隐藏武器专属文案
      GAME.UI.refreshWeapons(player);
    } else {
      GAME.Game.requestWeaponReplace(def); // 已双持 → 暂停战斗弹出替换/放弃界面
    }
  }
  return { rollEnemyDrops: rollEnemyDrops, spawnBossWeaponDrop: spawnBossWeaponDrop, update: update,
    applyBuff: applyBuff, recalc: recalc, rollCandidates: rollCandidates, isBuffCapped: isBuffCapped, fmt: fmt };
})();

/* ============================================================
 * Growth 模块：经验累积与升级结算（阈值曲线 / 溢出结转 / 连续升级 / 回满血）
 * ============================================================ */
GAME.Growth = (function () {
  /* 升级阈值曲线：base × step^(level-1) 向上取整；非法 level 钳 1 兜底，
     恒返回 ≥ 1 正整数（升级循环必然终止的防死循环红线） */
  function threshold(level) {
    const g = CONFIG.growth;
    const lv = (typeof level === 'number' && isFinite(level) && level >= 1) ? level : 1;
    return Math.max(1, Math.ceil(g.thresholdBase * Math.pow(g.thresholdStep, lv - 1)));
  }
  /* 经验累加与升级结算唯一入口：死亡守卫 → 累加 → 升级循环（溢出结转/连续升级） */
  function gainExp(player, amount) {
    if (player.hp <= 0) return; // 死亡结算优先（spec 4.2.6）
    if (!(typeof amount === 'number' && isFinite(amount) && amount > 0)) return; // 非法增量钳 0
    player.exp += amount;
    const g = CONFIG.growth;
    /* 升级循环：单次拾取跨越多个阈值时连续升级，溢出经验结转为当前等级进度（禁止经验丢失，spec 5.3.1 规则 6） */
    while (player.hp > 0 && player.exp >= threshold(player.level)) {
      player.exp -= threshold(player.level);
      player.level += 1;
      /* 每级属性收益累计（经 recalc 三源求和入算并受软上限钳制） */
      player.levelBonus.atk += g.levelBonus.atk;
      player.levelBonus.aspd += g.levelBonus.aspd;
      player.levelBonus.speed += g.levelBonus.speed;
      player.levelBonus.maxhp += g.levelBonus.maxhp;
      GAME.DropBuff.recalc(player);
      player.hp = player.maxHp; // 升级回满血（封顶天然成立，满血升级幂等无异常，spec 5.3.3 场景 1）
      GAME.UI.showToast('升级！Lv.' + player.level, 'level');
      GAME.AudioSys.play('levelup');
    }
  }
  return { threshold: threshold, gainExp: gainExp };
})();

/* ============================================================
 * Mates 模块：队友实体（无生命纯辅助）· 类型随机入场 · 黄金角跟随 · 协战
 * ============================================================ */
GAME.Mates = (function () {
  const World = GAME.World;

  /* 权重随机兜底：任一权重非法（非有限正数）或总和 ≤ 0 时均匀随机（spec 4.2 容错） */
  function pickSafe(items) {
    let total = 0, bad = false;
    for (const it of items) {
      if (!isFinite(it.weight) || it.weight <= 0) { bad = true; break; }
      total += it.weight;
    }
    if (bad || total <= 0) return items[Utils.randInt(0, items.length - 1)].key;
    return Utils.pickWeighted(items);
  }
  /* 增益型队友的增益名称（提示文案用） */
  function bonusName(key) {
    if (key === 'atk') return '攻击力提升';
    if (key === 'aspd') return '攻击速度提升';
    if (key === 'speed') return '移动速度提升';
    if (key === 'maxhp') return '最大生命提升';
    console.warn('未知队友增益类型: ' + key);
    return '属性提升';
  }

  /* 队友拾取结算入口：类型按权重随机 → 增益型随机携带一项增益 → 实体入容器 → 属性入算 */
  function add(player) {
    const cfg = CONFIG.mates;
    /* ① 类型随机（support 增益型 / combat 战斗型，spec 5.5.1 规则 2） */
    const type = pickSafe([
      { key: 'support', weight: cfg.typeWeights.support },
      { key: 'combat', weight: cfg.typeWeights.combat }
    ]);
    /* ② 增益型：按权重池随机携带一项增益并累计入 mateBonus（多名同类可叠加，spec 5.5.1 规则 6） */
    let buffKey = null;
    if (type === 'support') {
      const pool = cfg.supportBonus;
      buffKey = pickSafe(Object.keys(pool).map(function (k) { return { key: k, weight: pool[k].weight }; }));
      const def = pool[buffKey];
      if (def && typeof def.value === 'number' && isFinite(def.value)) {
        player.mateBonus[buffKey] += def.value;
      } else {
        console.warn('队友增益配置非法: ' + buffKey);
      }
    }
    /* ③ 生成队友实体（字段序固定，V8 隐藏类稳定；入场位置 = 玩家位置 + 队形相位偏移） */
    const phase = World.mates.length * cfg.goldenAngle;
    World.mates.push({
      type: type, buffKey: buffKey,
      x: player.x + Math.cos(phase) * cfg.followRadius,
      y: player.y + Math.sin(phase) * cfg.followRadius,
      phase: phase, fireCd: 0, rot: 0
    });
    /* ④ 属性重算（增益入算）+ HUD 队友统计刷新 + 类型明示提示 + 音效 */
    GAME.DropBuff.recalc(player);
    GAME.UI.refreshMates(player);
    GAME.AudioSys.play('mateGet');
    if (type === 'support') GAME.UI.showToast('获得增益型队友 · ' + bonusName(buffKey), 'buff');
    else GAME.UI.showToast('获得战斗型队友', 'buff');
  }

  /* 每帧队友行为：帧首共享最近敌人检索（每帧仅 1 次 O(敌人数)，决策 D6）
     → 跟随分支（全体：黄金角队形 + 追赶限速 + 超距钳制）+ 战斗分支（战斗型：冷却射击） */
  function update(dt, player) {
    const mates = World.mates;
    if (mates.length === 0) return;
    const cfg = CONFIG.mates;
    const target = World.findNearestEnemy(player.x, player.y);
    const followSpeed = player.speed * player.speedMul * cfg.catchUpSpeed;
    for (const m of mates) {
      /* 跟随：队形目标点 = 玩家位置 + 环绕半径 × 黄金角相位（任意数量自然散开，增减无需重排，决策 D7） */
      const tx = player.x + Math.cos(m.phase) * cfg.followRadius;
      const ty = player.y + Math.sin(m.phase) * cfg.followRadius;
      const dx = tx - m.x, dy = ty - m.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 1) {
        const step = Math.min(dist, followSpeed * dt);
        m.x += dx / dist * step;
        m.y += dy / dist * step;
      }
      /* 超距钳制回归：极端脱离时拉回玩家附近（防永久脱离/走出竞技场，spec 5.5.1 规则 5） */
      if (Utils.distSq(m.x, m.y, player.x, player.y) > cfg.maxLagDist * cfg.maxLagDist) {
        m.x = player.x + (m.x - player.x) * 0.3;
        m.y = player.y + (m.y - player.y) * 0.3;
      }
      /* 战斗型协战：冷却到且有存活目标时发射 mate 归属子弹（复用玩家命中管线，
         击杀统计/掉落 roll/暴击秒杀经既有 hitEnemy 通道自动联动，决策 D5） */
      if (m.type === 'combat') {
        m.fireCd -= dt;
        if (m.fireCd <= 0) {
          if (target) {
            const aim = Math.atan2(target.y - m.y, target.x - m.x);
            m.rot = aim;
            World.spawnBullet('mate', m.x, m.y, aim, cfg.combat.bulletSpeed,
              cfg.combat.damage, cfg.combat.bulletRadius, 'mate', cfg.combat.bulletLife);
            m.fireCd = cfg.combat.fireInterval;
          } else {
            m.fireCd = cfg.combat.retryCd; // 无敌人短重试（不攻击不报错）
          }
        }
      }
    }
  }
  return { add: add, update: update };
})();

/* ============================================================
 * Render 模块：Canvas 分层绘制管线 / 发光 / 特效 / 屏幕震动
 * 绘制顺序（后→前）：背景 → 掉落物 → 特效 → 敌人 → Boss → 玩家
 *                   → 子弹 → 粒子 → 浮动文字
 * ============================================================ */
GAME.Render = (function () {
  const R = { canvas: null, ctx: null, W: 0, H: 0, dpr: 1, shakeT: 0, shakeAmp: 0, glowTex: {}, gridPath: null, frame: 0 };

  function init() {
    R.canvas = document.getElementById('game-canvas');
    R.ctx = R.canvas.getContext('2d');
    /* 预渲染发光渐变贴图：高频元素（子弹/粒子）drawImage 复用，绕过 shadowBlur 逐帧滤波 */
    for (const key in CONFIG.colors.glow) R.glowTex[key] = makeGlow(CONFIG.colors.glow[key]);
  }
  function hexToRgba(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }
  function makeGlow(color) {
    const s = CONFIG.render.glowSize;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0, hexToRgba(color, 1));
    grd.addColorStop(0.35, hexToRgba(color, 0.55));
    grd.addColorStop(1, hexToRgba(color, 0));
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
    return c;
  }
  /* 画布自适应：物理尺寸 = 逻辑尺寸 × min(dpr, 2)，setTransform 统一缩放 */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.render.dprMax);
    R.W = w; R.H = h; R.dpr = dpr;
    R.canvas.width = Math.round(w * dpr);
    R.canvas.height = Math.round(h * dpr);
    R.canvas.style.width = w + 'px';
    R.canvas.style.height = h + 'px';
    R.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R.gridPath = null; // 尺寸变化后重建网格缓存
  }
  /* 屏幕震动：分级触发；同帧多次取最大值不叠加（HUD 的 DOM 层不参与） */
  function shake(power) {
    if (R.shakeT > 0) R.shakeAmp = Math.max(R.shakeAmp, power);
    else { R.shakeAmp = power; R.shakeT = CONFIG.shake.duration; }
  }
  function tickShake(dt) { if (R.shakeT > 0) R.shakeT = Math.max(0, R.shakeT - dt); }

  function drawGrid() {
    const ctx = R.ctx;
    if (!R.gridPath) {
      const p = new Path2D(), step = CONFIG.render.grid;
      for (let x = step; x < R.W; x += step) { p.moveTo(x, 0); p.lineTo(x, R.H); }
      for (let y = step; y < R.H; y += step) { p.moveTo(0, y); p.lineTo(R.W, y); }
      R.gridPath = p;
    }
    ctx.strokeStyle = CONFIG.colors.grid;
    ctx.lineWidth = 1;
    ctx.stroke(R.gridPath);
  }

  /* 掉落物层：几何图形 + bobT 正弦浮动 + 渐变光晕 */
  function drawDrops() {
    const ctx = R.ctx;
    for (const d of GAME.World.drops) {
      const bob = Math.sin(d.bobT) * 4;
      const x = d.x, y = d.y + bob;
      let color, glowKey, size;
      if (d.kind === 'buff') {
        color = d.tier === 'high' ? CONFIG.colors.buffHigh : CONFIG.colors.buffSmall;
        glowKey = d.tier === 'high' ? 'gold' : 'cyan';
        size = d.tier === 'high' ? 14 : 10;
      } else if (d.kind === 'exp') {
        color = CONFIG.colors.expOrb; glowKey = 'mint'; size = 9;
      } else if (d.kind === 'heal') {
        color = CONFIG.colors.healPack; glowKey = 'pink'; size = 11;
      } else if (d.kind === 'mate') {
        color = CONFIG.colors.mateDrop; glowKey = 'ice'; size = 12;
      } else if (d.kind === 'gauntlet') {
        color = CONFIG.colors.gauntletDrop; glowKey = 'magenta'; size = 12;
      } else if (d.kind === 'bow') {
        color = CONFIG.colors.bowDrop; glowKey = 'sunset'; size = 13;
      } else if (d.kind === 'staff') {
        color = CONFIG.colors.staffDrop; glowKey = 'purple'; size = 13;
      } else {
        color = CONFIG.colors.weaponDrop;
        glowKey = 'purple';
        size = 13;
      }
      const gs = size * 4;
      ctx.globalAlpha = 0.85;
      ctx.drawImage(R.glowTex[glowKey], x - gs / 2, y - gs / 2, gs, gs);
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      if (d.kind === 'buff') {
        /* 菱形增益晶体 */
        ctx.beginPath();
        ctx.moveTo(x, y - size); ctx.lineTo(x + size * 0.7, y);
        ctx.lineTo(x, y + size); ctx.lineTo(x - size * 0.7, y);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x, y, size * 0.22, 0, Math.PI * 2); ctx.fill();
      } else if (d.kind === 'exp') {
        /* 经验球：翠绿小球 + 白核（与增益菱形/武器剑形明确可区分，spec 6.2.4） */
        ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x, y, size * 0.4, 0, Math.PI * 2); ctx.fill();
      } else if (d.kind === 'heal') {
        /* 血包：粉红方块底 + 白十字（生命语义，与经验球翠绿直接可分辨，spec 5.4.1 规则 5） */
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x - size, y - size, size * 2, size * 2, 4);
        else ctx.rect(x - size, y - size, size * 2, size * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        const tw = size * 0.34, tl = size * 0.72;
        ctx.fillRect(x - tw / 2, y - tl / 2, tw, tl);
        ctx.fillRect(x - tl / 2, y - tw / 2, tl, tw);
      } else if (d.kind === 'mate') {
        /* 队友掉落：蓝白六边形伙伴徽记 + 白核 */
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = i * Math.PI / 3 - Math.PI / 2;
          const px = x + Math.cos(a) * size, py = y + Math.sin(a) * size;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x, y, size * 0.3, 0, Math.PI * 2); ctx.fill();
      } else if (d.kind === 'gauntlet') {
        /* 拳套掉落：品红方形拳身 + 四指节圆点轮廓（与既有五类掉落物直接可分辨，spec 5.2.1 规则 4） */
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x - size * 0.85, y - size * 0.7, size * 1.7, size * 1.4, 5);
        else ctx.rect(x - size * 0.85, y - size * 0.7, size * 1.7, size * 1.4);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(x - size * 0.45 + i * size * 0.3, y - size * 0.25, size * 0.11, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(x + size * 0.35, y + size * 0.3, size * 0.22, 0, Math.PI * 2);
        ctx.fill();
      } else if (d.kind === 'bow') {
        /* 神弓掉落：日落橙金弓形（弧形弓臂 + 弦线 + 中搭箭点，bow_staff_lifesteal spec 5.1.1 规则 5a） */
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.arc(x - size * 0.15, y, size * 0.95, -Math.PI * 0.42, Math.PI * 0.42); // 弓臂弧
        ctx.stroke();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        const bx = x - size * 0.15;
        const sx = Math.cos(Math.PI * 0.42) * size * 0.95, sy = Math.sin(Math.PI * 0.42) * size * 0.95;
        ctx.beginPath();
        ctx.moveTo(bx + sx, y - sy); ctx.lineTo(bx + sx, y + sy); // 弦线
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(bx - size * 0.55, y); ctx.lineTo(bx + size * 0.75, y);
        ctx.lineTo(bx + size * 0.55, y - size * 0.16); ctx.lineTo(bx + size * 0.55, y + size * 0.16);
        ctx.closePath(); ctx.fill(); // 搭在弦上的箭
      } else if (d.kind === 'staff') {
        /* 法杖掉落：紫罗兰长杖 + 顶端菱形宝石（与神弓弓形直接可分辨） */
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(x - size * 0.1, y + size); ctx.lineTo(x - size * 0.1, y - size * 0.35); // 杆身
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x - size * 0.1, y - size); // 顶端菱形宝石
        ctx.lineTo(x + size * 0.38, y - size * 0.55);
        ctx.lineTo(x - size * 0.1, y - size * 0.25);
        ctx.lineTo(x - size * 0.58, y - size * 0.55);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x - size * 0.1, y - size * 0.58, size * 0.12, 0, Math.PI * 2); ctx.fill(); // 宝石核
      } else {
        /* 剑形武器掉落：竖长剑刃 + 横护手 */
        ctx.beginPath();
        ctx.moveTo(x, y - size); ctx.lineTo(x + size * 0.3, y);
        ctx.lineTo(x, y + size * 0.8); ctx.lineTo(x - size * 0.3, y);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillRect(x - size * 0.7, y + size * 0.15, size * 1.4, 2.5);
      }
    }
  }

  /* 攻击特效层：刀扇形残影 / 长枪突刺残影 / 手枪枪口闪光 / 拳套冲击电弧 / 法阵爆发冲击与余韵 */
  function drawEffects() {
    const ctx = R.ctx;
    for (const ef of GAME.World.effects) {
      const k = ef.life / ef.maxLife;   // 1 → 0 渐隐进度
      const prog = 1 - k;               // 0 → 1 展开进度
      if (ef.kind === 'slash') {
        /* 扇形残影：半径 0.6×→1.0×range 展开 + 白色细弧线扫过 */
        const r = ef.extra.range * (0.6 + 0.4 * prog);
        ctx.globalAlpha = k * 0.55;
        ctx.fillStyle = ef.extra.color;
        ctx.beginPath();
        ctx.moveTo(ef.x, ef.y);
        ctx.arc(ef.x, ef.y, r, ef.angle - ef.extra.half, ef.angle + ef.extra.half);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = k * 0.9;
        ctx.strokeStyle = CONFIG.colors.slash;
        ctx.lineWidth = 2;
        const sweep = ef.angle - ef.extra.half + 2 * ef.extra.half * prog;
        ctx.beginPath();
        ctx.arc(ef.x, ef.y, r, sweep - 0.18, sweep + 0.05);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (ef.kind === 'thrust') {
        /* 突刺残影：细长矩形 0.3×→1.0× 快速伸出 + 中轴白色高亮 + 枪体图形 */
        const len = ef.extra.range * (0.3 + 0.7 * Math.min(1, prog / 0.65));
        const w = ef.extra.width;
        ctx.save();
        ctx.translate(ef.x, ef.y);
        ctx.rotate(ef.angle);
        ctx.globalAlpha = k * 0.65;
        ctx.fillStyle = ef.extra.color;
        ctx.fillRect(10, -w / 2, len, w);
        ctx.globalAlpha = k * 0.9;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(12 + len, 0); ctx.stroke();
        /* 玩家侧枪体（短杆+矛头）增强位移感 */
        ctx.globalAlpha = k;
        ctx.fillStyle = '#dfe6ff';
        ctx.fillRect(-4, -2.5, 16, 5);
        ctx.beginPath();
        ctx.moveTo(12 + len, -5); ctx.lineTo(12 + len + 9, 0); ctx.lineTo(12 + len, 5);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      } else if (ef.kind === 'muzzle') {
        /* 枪口闪光：星形双三角极速渐隐 */
        ctx.save();
        ctx.translate(ef.x, ef.y);
        ctx.rotate(ef.angle);
        ctx.globalAlpha = k;
        ctx.fillStyle = ef.extra.color;
        ctx.beginPath();
        ctx.moveTo(0, -3); ctx.lineTo(13, 0); ctx.lineTo(0, 3); ctx.lineTo(4, 0);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(2, -8); ctx.lineTo(5, 0); ctx.lineTo(2, 8); ctx.lineTo(8, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      } else if (ef.kind === 'punch') {
        /* 拳套首目标能量冲击：扇形残影展开渐隐（复用 slash 绘制模式，专属品红配色） */
        const r = ef.extra.range * (0.5 + 0.5 * prog);
        ctx.globalAlpha = k * 0.6;
        ctx.fillStyle = ef.extra.color;
        ctx.beginPath();
        ctx.moveTo(ef.x, ef.y);
        ctx.arc(ef.x, ef.y, r, ef.angle - ef.extra.half, ef.angle + ef.extra.half);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = k * 0.9;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(ef.x, ef.y, r, ef.angle - ef.extra.half, ef.angle + ef.extra.half);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (ef.kind === 'chain') {
        /* 连锁电弧：起点→终点多段随机抖动折线 + 品红→白双层描线 + 发光；
           dual 标记（双持叠加）时线宽加粗、亮度增强（可感知叠加信号，spec 5.5.1 规则 4） */
        const x2 = ef.extra.x2, y2 = ef.extra.y2;
        const segs = 5;
        ctx.globalAlpha = k;
        ctx.strokeStyle = CONFIG.colors.chainArc;
        ctx.lineWidth = ef.extra.dual ? 4 : 2.5;
        ctx.beginPath();
        ctx.moveTo(ef.x, ef.y);
        for (let i = 1; i < segs; i++) {
          const t = i / segs;
          const jx = (Math.random() - 0.5) * 14, jy = (Math.random() - 0.5) * 14;
          ctx.lineTo(ef.x + (x2 - ef.x) * t + jx, ef.y + (y2 - ef.y) * t + jy);
        }
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = ef.extra.dual ? 2 : 1.2;
        ctx.globalAlpha = k * 0.85;
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (ef.kind === 'burst') {
        /* 法阵爆发冲击（bow_staff_lifesteal design 2.5.1 D）：双扩张环 + 内嵌 flash 中心闪光——
           主环 R→1.35R 扩张收窄淡出（亮紫白），副环 0.7R→1.05R 反向内衬（双环夹击"爆发推离"层次）；
           flash 子阶段：前 flashLife 0.09s 进度段近白实心圆快速收缩（视觉锤峰值） */
        const Rr = ef.extra.radius;
        const rr = Rr * (1 + 0.35 * prog);
        ctx.globalAlpha = k * 0.95;
        ctx.strokeStyle = CONFIG.colors.zoneBurst;
        ctx.lineWidth = 6 - 4.5 * prog;
        ctx.beginPath(); ctx.arc(ef.x, ef.y, rr, 0, Math.PI * 2); ctx.stroke();
        const rr2 = Rr * (0.7 + 0.35 * prog);
        ctx.lineWidth = 2;
        ctx.globalAlpha = k * 0.7;
        ctx.beginPath(); ctx.arc(ef.x, ef.y, rr2, 0, Math.PI * 2); ctx.stroke();
        /* flash：burst 寿命前 flashLife 比例段内绘制的内嵌子阶段 */
        const flashFrac = CONFIG.fx.zone.flashLife / CONFIG.fx.burstLife;
        if (prog < flashFrac) {
          const fp = prog / flashFrac; // 0→1 收缩进度
          ctx.globalAlpha = 1 - fp;
          ctx.fillStyle = CONFIG.colors.zoneFlash;
          ctx.beginPath(); ctx.arc(ef.x, ef.y, 26 - 20 * fp, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (ef.kind === 'burstAfter') {
        /* 法阵余韵（design 2.5.1 E）：R×0.95 细描边环按 2 次呼吸节奏明灭后消散——
           alpha × |sin(π × 进度 × 2)|（"能量耗尽后的残响"），纯视觉无判定 */
        const Rr = ef.extra.radius * 0.95;
        ctx.globalAlpha = k * 0.4 * Math.abs(Math.sin(Math.PI * prog * 2));
        ctx.strokeStyle = CONFIG.colors.zoneWarn;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(ef.x, ef.y, Rr, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  /* 敌人层：按类型分组批量绘制（shadowBlur"同类一次设置"纪律） */
  function drawEnemies(player) {
    const ctx = R.ctx;
    const groups = {};
    for (const e of GAME.World.enemies) {
      const key = e.def.key;
      (groups[key] || (groups[key] = [])).push(e);
    }
    for (const key in groups) {
      const arr = groups[key], def = CONFIG.enemies.defs[key];
      ctx.shadowColor = def.color;
      ctx.shadowBlur = 12;
      for (const e of arr) drawEnemyBody(ctx, e, def, player);
    }
    ctx.shadowBlur = 0;
  }
  function drawEnemyBody(ctx, e, def, player) {
    const fill = e.hitFlashT > 0 ? '#ffffff' : def.color; // 受击闪白（优先级高于灼烧罩染，既有短路在前）
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(ang);
    ctx.fillStyle = fill;
    ctx.strokeStyle = CONFIG.colors.edge;
    ctx.lineWidth = 1.5;
    const r = e.radius;
    if (def.shape === 'triangle') { /* 普通近战：等边三角 */
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(-r * 0.8, -r * 0.85); ctx.lineTo(-r * 0.8, r * 0.85);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (def.shape === 'dart') { /* 快速近战：细长菱形 */
      ctx.beginPath();
      ctx.moveTo(r * 1.5, 0); ctx.lineTo(0, -r * 0.6); ctx.lineTo(-r, 0); ctx.lineTo(0, r * 0.6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (def.shape === 'circle') { /* 普通远程：圆 + 内点 */
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.arc(r * 0.35, 0, r * 0.25, 0, Math.PI * 2); ctx.fill();
    } else { /* 精英远程：大六边形（慢速自转 + 内环标识） */
      ctx.rotate(-ang + performance.now() * 0.0012);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    /* 灼烧着火视觉（bow_staff_lifesteal D17，design 2.5.2 B）：罩染 + 脉冲外环两笔叠加——
       burnT ≤ 0 或实体消亡自然消失（零同步代码）；不走 shadowBlur（60 敌全灼烧极端场景的分组绘制纪律） */
    if (e.burnT > 0) drawBurnOverlay(ctx, e);
  }
  /* 灼烧罩染与脉冲外环（敌人/Boss 共用）：脉冲相位共用 performance.now() 时间源（视觉呼吸同步）；
     刷新后 burnTickT 接近满值的前 refreshBoostT 秒内罩染增亮（"重新点燃"瞬时反馈，design 2.5.2 F） */
  function drawBurnOverlay(ctx, t) {
    const fxc = CONFIG.fx.burn;
    const now = performance.now();
    const half = 0.5 + 0.5 * Math.sin(now * 0.001 * fxc.tintHz * Math.PI * 2); // 0~1 呼吸
    let alpha = fxc.tintPulseMin + (fxc.tintPulseMax - fxc.tintPulseMin) * half;
    /* 刷新增亮窗口：burnTickT 刚重置（> interval - refreshBoostT）时罩染 ×refreshBoostMul 钳制 0.26 */
    const bdef = CONFIG.weapons.bow;
    if (t.burnTickT > bdef.burnInterval - fxc.refreshBoostT) {
      alpha = Math.min(alpha * fxc.refreshBoostMul, 0.26);
    }
    /* 罩染：火色半透明圆（覆盖本体的大致范围——用外接圆近似各形状，一笔普通路径开销恒定） */
    ctx.globalAlpha = alpha;
    ctx.fillStyle = CONFIG.colors.burnTint;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.radius * 0.92, 0, Math.PI * 2); ctx.fill();
    /* 脉冲外环：半径 r + 3 + 呼吸幅度的 1.5px 橙色细环（灼烧状态标识） */
    ctx.globalAlpha = 0.5 + 0.25 * half;
    ctx.strokeStyle = CONFIG.colors.burnRing;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.radius + 3 + fxc.ringBreath * half, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* Boss 层：金色八边形 + 强化发光 + 受击震动偏移 + 蓄力闪烁预警 */
  function drawBoss() {
    const b = GAME.World.boss;
    if (!b) return;
    const ctx = R.ctx;
    let ox = 0, oy = 0;
    if (b.shakeT > 0) { // 实体级震动：仅视觉偏移，逻辑坐标与碰撞不受影响
      ox = (Math.random() - 0.5) * 2 * CONFIG.boss.hitShakeAmp;
      oy = (Math.random() - 0.5) * 2 * CONFIG.boss.hitShakeAmp;
    }
    const flashing = (b.state === 'charge_wind' || b.state === 'spawn') && Math.floor(R.frame / 4) % 2 === 0;
    ctx.save();
    ctx.translate(b.x + ox, b.y + oy);
    ctx.rotate(b.rot);
    ctx.shadowColor = CONFIG.colors.bossGlow;
    ctx.shadowBlur = 28;
    ctx.fillStyle = flashing ? '#ffffff' : CONFIG.colors.bossBody;
    ctx.strokeStyle = CONFIG.colors.bossEdge;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      const px = Math.cos(a) * b.radius, py = Math.sin(a) * b.radius;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    /* 内层核心 */
    ctx.shadowBlur = 0;
    ctx.fillStyle = flashing ? CONFIG.colors.bossEdge : 'rgba(120,70,0,0.55)';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.PI / 8;
      const rr = b.radius * 0.55;
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    /* 灼烧着火视觉：Boss 与普通敌人同规则（spec 5.3.1 规则 4 对 Boss 照常生效的视觉面） */
    if (b.burnT > 0) drawBurnOverlay(ctx, b);
  }

  /* 玩家层：蓝紫圆形 + 朝向指示楔形 + 无敌帧半透明闪烁 */
  function drawPlayer(p) {
    if (!p || p.hp <= 0) return;
    const ctx = R.ctx;
    ctx.save();
    if (p.invincibleT > 0 && Math.floor(R.frame / 3) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.shadowColor = CONFIG.colors.playerGlow;
    ctx.shadowBlur = 16;
    ctx.fillStyle = CONFIG.colors.playerBody;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.stroke();
    /* 朝向指示楔形 */
    ctx.translate(p.x, p.y);
    ctx.rotate(p.aimAngle);
    ctx.fillStyle = CONFIG.colors.playerAim;
    ctx.beginPath();
    ctx.moveTo(p.radius + 9, 0);
    ctx.lineTo(p.radius - 1, -5);
    ctx.lineTo(p.radius - 1, 5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* 队友层：增益型（青色菱形+外圈光环）/ 战斗型（紫白小三角朝向目标）分组批量绘制
     （每帧 2 次 shadowBlur 设置，纪律同 drawEnemies；未知类型跳过绘制） */
  function drawMates() {
    const mates = GAME.World.mates;
    if (mates.length === 0) return;
    const ctx = R.ctx, cfg = CONFIG.mates, r = cfg.radius;
    /* 增益型：青色菱形 + 外圈光环（表意增益光环） */
    ctx.shadowColor = CONFIG.colors.expOrb;
    ctx.shadowBlur = 10;
    for (const m of mates) {
      if (m.type !== 'support') continue;
      ctx.fillStyle = '#7dffd4';
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y - r); ctx.lineTo(m.x + r * 0.7, m.y);
      ctx.lineTo(m.x, m.y + r); ctx.lineTo(m.x - r * 0.7, m.y);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(125,255,212,0.4)';
      ctx.beginPath(); ctx.arc(m.x, m.y, r + 5, 0, Math.PI * 2); ctx.stroke();
    }
    /* 战斗型：紫白小三角（朝向本帧攻击目标） */
    ctx.shadowColor = CONFIG.colors.mateDrop;
    for (const m of mates) {
      if (m.type !== 'combat') continue;
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(m.rot);
      ctx.fillStyle = CONFIG.colors.bulletMate;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(-r * 0.8, -r * 0.7); ctx.lineTo(-r * 0.8, r * 0.7);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  /* 子弹层：加法混合 + 渐变贴图；玩家子弹带渐细渐淡拖尾；神弓箭矢带橙金拖尾与箭头弹体 */
  function drawBullets() {
    const ctx = R.ctx;
    ctx.globalCompositeOperation = 'lighter';
    for (const b of GAME.World.bullets) {
      if (!b.active) continue;
      if (b.style === 'player') {
        const pts = b.trail, n = pts.length / 2;
        if (n > 1) {
          ctx.strokeStyle = CONFIG.colors.bulletPlayer;
          for (let i = 0; i < n - 1; i++) {
            ctx.globalAlpha = ((i + 1) / n) * 0.5;
            ctx.lineWidth = ((i + 1) / n) * 2.2;
            ctx.beginPath();
            ctx.moveTo(pts[i * 2], pts[i * 2 + 1]);
            ctx.lineTo(pts[(i + 1) * 2], pts[(i + 1) * 2 + 1]);
            ctx.stroke();
          }
        }
      } else if (b.style === 'arrow') {
        /* 箭矢拖尾：日落橙金渐细渐淡（对齐 player 分支逐段绘制模式，bow_staff_lifesteal D1 渲染面） */
        const pts = b.trail, n = pts.length / 2;
        if (n > 1) {
          ctx.strokeStyle = CONFIG.colors.arrowBullet;
          for (let i = 0; i < n - 1; i++) {
            ctx.globalAlpha = ((i + 1) / n) * 0.55;
            ctx.lineWidth = ((i + 1) / n) * 2.6;
            ctx.beginPath();
            ctx.moveTo(pts[i * 2], pts[i * 2 + 1]);
            ctx.lineTo(pts[(i + 1) * 2], pts[(i + 1) * 2 + 1]);
            ctx.stroke();
          }
        }
      }
      const tex = R.glowTex[b.style === 'player' ? 'cyan' : (b.style === 'boss' ? 'gold' :
        (b.style === 'mate' ? 'ice' : (b.style === 'arrow' ? 'sunset' : 'orange')))];
      const s = b.radius * 6;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(tex, b.x - s / 2, b.y - s / 2, s, s);
      ctx.globalAlpha = 1;
      if (b.style === 'arrow') {
        /* 箭头弹体：沿速度方向的拉长菱形箭镞（区别于圆头子弹的目视判据） */
        const ang = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(ang);
        ctx.fillStyle = CONFIG.colors.arrowBullet;
        ctx.beginPath();
        ctx.moveTo(b.radius * 1.8, 0);
        ctx.lineTo(-b.radius * 0.6, -b.radius * 0.55);
        ctx.lineTo(-b.radius * 1.2, 0);
        ctx.lineTo(-b.radius * 0.6, b.radius * 0.55);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius * 0.55, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 粒子层：加法混合 + 渐变贴图 + 尺寸随寿命衰减 */
  function drawParticles() {
    const ctx = R.ctx;
    ctx.globalCompositeOperation = 'lighter';
    for (const p of GAME.World.particles) {
      const k = p.life / p.maxLife;
      const s = p.size * 3 * k + 2;
      ctx.globalAlpha = k;
      ctx.drawImage(R.glowTex[p.colorKey] || R.glowTex.white, p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 浮动文字层：伤害数字上浮淡出（普通白色小字 / 暴击金色大字 / 秒杀亮金特大字红描边，spec 5.3.1 规则 8） */
  function drawFloatTexts() {
    const ctx = R.ctx;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of GAME.World.floatTexts) {
      ctx.globalAlpha = Math.min(1, (f.life / CONFIG.fx.floatLife) * 2);
      if (f.style === 'ikill') {
        /* 秒杀专属：26px 亮金主体 + 红色外描边 + 深色内描边双层保证深色背景可读（字号 ≥ 暴击 22） */
        ctx.font = 'bold 26px "Segoe UI", sans-serif';
        ctx.strokeStyle = CONFIG.colors.ikillEdge;
        ctx.lineWidth = 5;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth = 3;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = CONFIG.colors.ikillText;
        ctx.fillText(f.text, f.x, f.y);
      } else if (f.style === 'heal') {
        /* 吸血回复：绿色数字，字号介于普通伤害与暴击之间（深色描边保证可读，spec 5.5.1 规则 3） */
        ctx.font = 'bold 17px "Segoe UI", sans-serif';
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth = 3;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = CONFIG.colors.healText;
        ctx.fillText(f.text, f.x, f.y);
      } else if (f.style === 'burn') {
        /* 灼烧跳伤：橙色小字（13px，小于普攻 14px 的层级关系；五色可辨体系 design 2.5.2 D——
           秒杀紫金 26/暴击金 22/heal 绿 17/普攻白 14/burn 橙 13） */
        ctx.font = 'bold 13px "Segoe UI", sans-serif';
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth = 3;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = CONFIG.colors.burnText;
        ctx.fillText(f.text, f.x, f.y);
      } else {
        ctx.font = f.style === 'crit' ? 'bold 22px "Segoe UI", sans-serif' : 'bold 14px "Segoe UI", sans-serif';
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth = 3;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.style === 'crit' ? CONFIG.colors.critText : CONFIG.colors.dmgText;
        ctx.fillText(f.text, f.x, f.y);
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 法阵预警层（bow_staff_lifesteal D16，design 2.5.1 B/C）：以 prog = 1 - t/maxT 单一时间源驱动
     常驻五层结构（绘制序 L5→L1→L2→L3→L4，后绘覆盖上层）——L5 地面微光淡入 → L1 虚线收缩环
     （warnShrink×R 线性收缩至 1.0R，"触碰"主实环时刻与判定时刻严格同帧）→ L2 边界主实环
     （判定范围唯一视觉真值，半径与判定半径同源 zone.radius）→ L3 符文刻度环（runes 刻度均布 ×
     spinSpeed 旋转，末期亮度脉动）→ L4 中心聚能核（膨胀渐亮，末期短促闪缩）；
     双持第六环（growthRate === 2 判据）：dualInnerScale×R 反向旋转第二符文环（双层嵌套目视判据）；
     法阵实体当帧移除后五层绘制自然终止（零过渡代码）；<=3 实体 × 6 路径/帧开销与敌人绘制同级 */
  function drawZones() {
    const zones = GAME.World.zones;
    if (zones.length === 0) return;
    const ctx = R.ctx, zc = CONFIG.fx.zone, C = CONFIG.colors;
    const now = performance.now();
    for (const z of zones) {
      const Rr = z.radius;
      const prog = 1 - z.t / z.maxT; // 0 → 1
      /* L5 地面微光：radial 渐变（中心 glowAlpha × 淡入系数 → 外沿 0） */
      const gl = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, Rr * 0.95);
      const ga = zc.glowAlpha * (0.3 + 0.7 * prog);
      gl.addColorStop(0, C.zoneWarn);
      gl.addColorStop(1, 'rgba(167,139,255,0)');
      ctx.globalAlpha = ga;
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(z.x, z.y, Rr * 0.95, 0, Math.PI * 2); ctx.fill();
      /* L1 虚线收缩环：1.22R → 1.0R 线性收缩 + 虚线沿收缩方向流动 + 线宽渐增 */
      const r1 = Rr * (zc.warnShrink - (zc.warnShrink - 1) * prog);
      ctx.globalAlpha = 0.35 + 0.55 * prog;
      ctx.strokeStyle = C.zoneWarn;
      ctx.lineWidth = 2 + 1.5 * prog;
      ctx.setLineDash([6, 8]);
      ctx.lineDashOffset = -prog * 40;
      ctx.beginPath(); ctx.arc(z.x, z.y, r1, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      /* L2 边界主实环：静止边界 + alpha 呼吸（末期最亮）+ 内侧 8px 渐变填充 */
      ctx.globalAlpha = 0.55 + 0.15 * Math.sin(prog * Math.PI * 2);
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(z.x, z.y, Rr, 0, Math.PI * 2); ctx.stroke();
      const inner = ctx.createRadialGradient(z.x, z.y, Rr - 8, z.x, z.y, Rr);
      inner.addColorStop(0, 'rgba(167,139,255,0)');
      inner.addColorStop(1, C.zoneWarn);
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = inner;
      ctx.beginPath(); ctx.arc(z.x, z.y, Rr, 0, Math.PI * 2); ctx.fill();
      /* L3 符文刻度环：runes 刻度均布 + 整环旋转 + prog ≥ 0.6 亮度脉动（符文逐个"亮起"） */
      const r3 = Rr * 0.82;
      const spin = now * 0.001 * zc.spinSpeed;
      let runeAlpha = 0.4 + 0.6 * prog;
      if (prog >= 0.6) runeAlpha *= 0.7 + 0.3 * Math.sin(now * 0.02);
      ctx.globalAlpha = runeAlpha;
      ctx.lineWidth = 2;
      for (let i = 0; i < zc.runes; i++) {
        const a = spin + i * Math.PI * 2 / zc.runes;
        const rx = z.x + Math.cos(a) * r3, ry = z.y + Math.sin(a) * r3;
        ctx.beginPath(); ctx.arc(rx, ry, 2, 0, Math.PI * 2); ctx.fill(); // 4px 短弧刻度以小圆近似
      }
      /* 双持第六环（D7 growthRate === 2 判据）：0.62R 反向旋转第二符文环（6 刻度） */
      if (z.growthRate === 2) {
        const r6 = Rr * zc.dualInnerScale;
        const spin2 = -now * 0.001 * zc.spinSpeed;
        ctx.globalAlpha = runeAlpha * 0.85;
        for (let i = 0; i < zc.dualRunes; i++) {
          const a = spin2 + i * Math.PI * 2 / zc.dualRunes;
          const rx = z.x + Math.cos(a) * r6, ry = z.y + Math.sin(a) * r6;
          ctx.beginPath(); ctx.arc(rx, ry, 1.8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 0.35 + 0.3 * prog;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(z.x, z.y, r6, 0, Math.PI * 2); ctx.stroke();
      }
      /* L4 中心聚能核：1.5 → coreMaxR 膨胀渐亮 + prog ≥ 0.85 短促闪缩（半径 ±8%）+ 亮色描边预演爆发色相 */
      let coreR = 1.5 + (zc.coreMaxR - 1.5) * prog;
      if (prog >= 0.85) coreR *= 1 + 0.08 * Math.sin(now * 0.06);
      ctx.globalAlpha = 0.4 + 0.55 * prog;
      ctx.fillStyle = C.zoneWarn;
      ctx.beginPath(); ctx.arc(z.x, z.y, coreR, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = C.zoneBurst;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x, z.y, coreR + 2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* 每帧唯一绘制入口（任何状态都重绘；暂停态画面静止） */
  function drawFrame(player) {
    const ctx = R.ctx, W = R.W, H = R.H;
    R.frame++;
    ctx.fillStyle = CONFIG.colors.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    /* 屏幕震动平移：幅度随剩余时间线性衰减，包裹整个战斗管线 */
    if (R.shakeT > 0) {
      const k = R.shakeT / CONFIG.shake.duration;
      ctx.translate((Math.random() - 0.5) * 2 * R.shakeAmp * k, (Math.random() - 0.5) * 2 * R.shakeAmp * k);
    }
    drawGrid();
    ctx.strokeStyle = CONFIG.colors.border;
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
    drawDrops();
    drawZones(); // 法阵预警（地面附着层，不遮挡敌人本体，design 2.5.1 B 绘制顺序）
    drawEffects();
    if (player) drawEnemies(player);
    drawBoss();
    drawPlayer(player);
    drawMates();
    drawBullets();
    drawParticles();
    drawFloatTexts();
    ctx.restore();
  }
  /* 将控制方法挂到渲染状态容器上：Render 模块即容器本身（W/H/ctx 与方法同对象） */
  R.init = init;
  R.resize = resize;
  R.shake = shake;
  R.tickShake = tickShake;
  R.drawFrame = drawFrame;
  return R;
})();

/* ============================================================
 * UI 模块：五界面互斥切换 + HUD 脏标记更新 + 提示浮层
 * ============================================================ */
GAME.UI = (function () {
  let el = {};            // 缓存的 DOM 引用
  const last = {};        // HUD 脏标记缓存（仅变化字段触碰 DOM）
  const SCREENS = ['start', 'select', 'pause', 'replace', 'over', 'buffchoice'];

  function $(id) { return document.getElementById(id); }

  function init() {
    el = {
      hud: $('hud'), floor: $('hud-floor'), kills: $('hud-kills'),
      hpFill: $('hp-fill'), hpText: $('hp-text'), buffBar: $('buff-bar'),
      lvBadge: $('lv-badge'), expFill: $('exp-fill'), mateBar: $('mate-bar'),
      bossWrap: $('boss-bar-wrap'), bossName: $('boss-name'), bossFill: $('boss-fill'),
      wslots: [$('wslot-0'), $('wslot-1')],
      toastLayer: $('toast-layer'), weaponCards: $('weapon-cards'),
      bestRecord: $('best-record'), replaceInfo: $('replace-info'),
      overStats: $('over-stats'), overRecord: $('over-record'),
      buffchoiceTitle: $('buffchoice-title'), buffCards: $('buff-cards'),
      redeemPanel: $('redeem-panel'), redeemInput: $('redeem-input')
    };
    buildWeaponCards(); // 武器选择卡片动态构建（基础三武器 + 兑换解锁后追加拳套，spec 5.6.1 规则 3）
    /* 界面按钮事件绑定 */
    $('btn-start').addEventListener('click', function () { GAME.Game.beginSelect(); });
    $('btn-resume').addEventListener('click', function () { GAME.Game.togglePause(); });
    $('btn-restart-pause').addEventListener('click', function () { GAME.Game.restart(); });
    $('btn-replace-1').addEventListener('click', function () { GAME.Game.confirmWeaponReplace('slot1'); });
    $('btn-replace-2').addEventListener('click', function () { GAME.Game.confirmWeaponReplace('slot2'); });
    $('btn-replace-discard').addEventListener('click', function () { GAME.Game.confirmWeaponReplace('discard'); });
    $('btn-restart-over').addEventListener('click', function () { GAME.Game.restart(); });
    $('btn-pause').addEventListener('click', function () { GAME.Game.togglePause(); });
    /* 兑换码交互绑定（spec 5.6.1 规则 1/8）：入口展开/收起 + 提交分发四类反馈 + 输入长度约束 */
    el.redeemInput.maxLength = CONFIG.redeem.inputMaxLength;
    $('btn-redeem').addEventListener('click', function () { el.redeemPanel.classList.toggle('on'); });
    $('btn-redeem-close').addEventListener('click', function () {
      el.redeemPanel.classList.remove('on');
      el.redeemInput.value = '';
    });
    $('btn-redeem-ok').addEventListener('click', function () {
      const r = GAME.Game.redeemCode(el.redeemInput.value);
      if (r.status === 'success') {
        showToast(r.msg, 'redeem');           // 专属品金渐变样式 + 专属音效（反馈强度最高，决策 D10）
        GAME.AudioSys.play(CONFIG.redeem.sfx);
        el.redeemPanel.classList.remove('on'); // 成功后收起面板并清空输入
        el.redeemInput.value = '';
      } else {
        showToast(r.msg, 'buff');             // 空/无效/已兑换：普通样式无音效（spec 5.6.1 规则 8a）
      }
    });
  }

  /* 武器选择卡片动态构建（spec 5.6.1 规则 3/4）：全量重建天然禁止重复卡片（兑换幂等，spec 4.2.8）；
     基础三武器 + redeemed 时追加全部三把隐藏武器（三选一→六选一，bow_staff_lifesteal D13 语义升级——
     老玩家 redeemed=true 读档即六选一，零迁移零重兑）；隐藏武器卡附加专属类与"隐藏"角标 */
  function buildWeaponCards() {
    el.weaponCards.innerHTML = '';
    const order = ['knife', 'spear', 'pistol'];
    if (GAME.Storage.loadRecord().redeemed) order.push('gauntlet', 'bow', 'staff');
    for (const wid of order) {
      const def = CONFIG.weapons[wid];
      if (!def) { console.warn('未知武器: ' + wid); continue; } // 防御性跳过（正常配置不触发）
      const card = document.createElement('div');
      card.className = 'weapon-card' + (def.hidden ? ' hidden-weapon' : '');
      card.dataset.weapon = wid;
      const typeText = def.type === 'melee_arc' ? '近战 · 扇形' : (def.type === 'melee_thrust' ? '近战 · 突刺' :
        (def.type === 'melee_chain' ? '近战 · 连锁' : (def.type === 'ranged_multi' ? '远程 · 多向' :
          (def.type === 'zone_cast' ? '远程 · 法阵' : '远程 · 子弹'))));
      const rangeText = def.type === 'ranged' ? '射程 远' : (def.type === 'zone_cast' ? '半径 ' + def.zoneRadius : '范围 ' + def.range);
      card.innerHTML =
        (def.hidden ? '<span class="wcard-hidden">隐藏</span>' : '') +
        '<h3>' + def.name + '</h3>' +
        '<span class="wcard-type">' + typeText + '</span>' +
        '<div class="wcard-desc">' + def.desc + '</div>' +
        '<div class="wcard-stats">伤害 ' + def.damage + ' · 冷却 ' + def.cooldown + 's · ' + rangeText + '</div>';
      card.addEventListener('click', function () { GAME.Game.startRun(wid); });
      el.weaponCards.appendChild(card);
    }
  }

  function showScreen(name) {
    for (const s of SCREENS) $('screen-' + s).classList.toggle('on', s === name);
  }
  function hideAllScreens() { showScreen(null); }
  function showHUD(on) { el.hud.classList.toggle('on', !!on); }

  /* 开始界面：标题 + 操作说明 + 开始按钮 + 最高纪录（四要素） */
  function showStart(record) {
    el.bestRecord.textContent = '最高纪录：第 ' + record.bestFloor + ' 层 · 击杀 ' + record.bestKills + ' · 击败 Boss ' + record.bestBossKills;
    showScreen('start');
  }

  /* 武器替换界面：新武器与两槽现有武器对比 + 三选一 */
  function showReplace(newDef, slots) {
    /* 类型文案行（spec 5.5.1 规则 2）：六武器同口径，与武器选择卡片 typeText 一致（bow_staff_lifesteal spec 5.7.1 规则 2a） */
    function typeTextOf(def) {
      if (def.type === 'melee_arc') return '近战 · 扇形';
      if (def.type === 'melee_thrust') return '近战 · 突刺';
      if (def.type === 'melee_chain') return '近战 · 连锁';
      if (def.type === 'ranged_multi') return '远程 · 多向';
      if (def.type === 'zone_cast') return '远程 · 法阵';
      return '远程 · 子弹';
    }
    function cardHtml(def, isSlot) {
      return '<div class="replace-card' + (isSlot ? ' slot-card' : '') + '">' +
        '<h4>' + def.name + (isSlot ? '' : '（新）') + '</h4>' +
        '<span class="rcard-type">' + typeTextOf(def) + '</span>' +
        '<p>伤害 ' + def.damage + ' · 冷却 ' + def.cooldown + 's</p>' +
        '<p>' + def.desc + '</p></div>';
    }
    let html = cardHtml(newDef, false);
    for (let i = 0; i < slots.length; i++) {
      html += slots[i] ? cardHtml(slots[i].def, true).replace('<h4>', '<h4>槽' + (i + 1) + '·') : '';
    }
    el.replaceInfo.innerHTML = html;
    showScreen('replace');
  }

  /* 增益选择界面（清关三选一 / Boss 二选一共用，spec 5.5.1）：
     卡片要素 = 名称 + 本次数值 + 品质档位 + 一句话描述；秒杀卡专属稀有样式 + 对 Boss 规则说明；
     上限回补卡标注"已达上限"；无任何跳过/关闭途径（必选规则 spec 5.1.1 规则 4） */
  function showBuffChoice(candidates, kind) {
    const fmt = GAME.DropBuff.fmt;
    const tier = kind === 'boss' ? 'high' : 'small';
    const tierText = kind === 'boss' ? '高品质增益' : '小型增益';
    el.buffchoiceTitle.textContent = kind === 'boss' ? 'BOSS 奖励 · 二选一' : '清关奖励 · 三选一';
    el.buffCards.innerHTML = '';
    for (const cand of candidates) {
      const def = CONFIG.drops.buffs[cand.type];
      if (!def) { console.warn('未知增益候选: ' + cand.type); continue; }
      const card = document.createElement('div');
      card.className = 'buff-card' + (def.rare ? ' rare' : '') + (cand.isCapped ? ' capped' : '');
      card.dataset.buff = cand.type;
      let html =
        (def.rare ? '<span class="bcard-rare">最稀有</span>' : '') +
        '<h3>' + def.name + '</h3>' +
        '<div class="bcard-value">+' + fmt(def[tier], def.pct) + '</div>' +
        '<span class="bcard-tier' + (kind === 'boss' ? ' high' : '') + '">' + tierText + '</span>' +
        '<div class="bcard-desc">' + (def.desc || '') + '</div>';
      if (def.rare && def.bossNote) html += '<div class="bcard-boss-note">' + def.bossNote + '</div>';
      if (cand.isCapped) html += '<div class="bcard-capped-note">已达上限 · 选择后数值不变</div>';
      card.innerHTML = html;
      /* 闭包携带 type（避免 dataset 字符串注入面）；点击立即确认（双端 tap 合成 click，同武器卡片机制） */
      card.addEventListener('click', (function (type) {
        return function () { GAME.Game.confirmBuffChoice(type); };
      })(cand.type));
      el.buffCards.appendChild(card);
    }
    showScreen('buffchoice');
  }

  /* 结算界面：五项统计 + 新纪录标注 + 重新开始按钮 */
  function showGameOver(stats, finalRecord, isNew) {
    const weaponNames = stats.usedWeaponIds.map(function (id) { return CONFIG.weapons[id].name; }).join('、');
    el.overStats.innerHTML =
      '<div class="stat-row"><span>到达层数</span><b>第 ' + stats.floor + ' 层</b></div>' +
      '<div class="stat-row"><span>击杀数</span><b>' + stats.kills + '</b></div>' +
      '<div class="stat-row"><span>击败 Boss 数</span><b>' + stats.bossKills + '</b></div>' +
      '<div class="stat-row"><span>使用武器</span><b>' + weaponNames + '</b></div>';
    el.overRecord.innerHTML = isNew
      ? '<span class="new-record">★ 新纪录！★</span> 最高纪录：第 ' + finalRecord.bestFloor + ' 层'
      : '最高纪录：第 ' + finalRecord.bestFloor + ' 层 · 击杀 ' + finalRecord.bestKills + ' · Boss ' + finalRecord.bestBossKills;
    showScreen('over');
  }

  /* HUD 脏标记更新：文本仅在变化时写 textContent；条形用 transform/height */
  function updateHUD(g) {
    if (!g.player || !g.stats) return;
    const p = g.player, st = g.stats;
    const floorStr = '第 ' + st.floor + ' 关';
    if (last.floor !== floorStr) { el.floor.textContent = floorStr; last.floor = floorStr; }
    const killStr = '击杀 ' + st.kills;
    if (last.kills !== killStr) { el.kills.textContent = killStr; last.kills = killStr; }
    /* 经验条与等级徽章（脏标记：等级文本变化才写、经验比例变化才写 transform，spec 5.3.1 规则 7） */
    const lvStr = 'Lv.' + p.level;
    if (last.level !== lvStr) { el.lvBadge.textContent = lvStr; last.level = lvStr; }
    const expNeed = GAME.Growth.threshold(p.level);
    const expRatio = expNeed > 0 ? Utils.clamp(p.exp / expNeed, 0, 1) : 0;
    const expKey = expRatio.toFixed(4);
    if (last.exp !== expKey) { el.expFill.style.transform = 'scaleX(' + expRatio + ')'; last.exp = expKey; }
    const hpRatio = p.maxHp > 0 ? Utils.clamp(p.hp / p.maxHp, 0, 1) : 0;
    el.hpFill.style.transform = 'scaleX(' + hpRatio + ')';
    const hpStr = Math.ceil(p.hp) + '/' + Math.round(p.maxHp);
    if (last.hp !== hpStr) { el.hpText.textContent = hpStr; last.hp = hpStr; }
    /* 双武器槽冷却进度（合成层友好操作，直接设置） */
    for (let i = 0; i < 2; i++) {
      const ws = p.slots[i];
      const overlay = el.wslots[i].querySelector('.cd-overlay');
      if (!ws) { overlay.style.height = '0%'; continue; }
      const total = Math.max(ws.def.cooldown / p.aspdMul, CONFIG.combat.minCooldown);
      overlay.style.height = (Utils.clamp(ws.cooldownT / total, 0, 1) * 100) + '%';
    }
    /* Boss 血条：Boss 存活期间常驻显示 */
    const b = GAME.World.boss;
    const bossOn = !!(b && b.hp > 0);
    if (last.bossOn !== bossOn) {
      el.bossWrap.style.display = bossOn ? 'block' : 'none';
      last.bossOn = bossOn;
      if (bossOn) el.bossName.textContent = '强化体 BOSS-' + b.bossIndex;
    }
    if (bossOn) el.bossFill.style.transform = 'scaleX(' + Utils.clamp(b.hp / b.maxHp, 0, 1) + ')';
  }

  /* 武器槽显示刷新（事件级：获得/替换/切换武器时调用） */
  function refreshWeapons(p) {
    /* 双持叠加标识（spec 5.5.1 规则 4）：两槽均为充能拳套时追加专属 class（品红发光边框），
       任一槽非拳套时移除——玩家无需查阅文档即可感知叠加状态 */
    const dualGauntlet = !!(p.slots[0] && p.slots[1] &&
      p.slots[0].def.id === 'gauntlet' && p.slots[1].def.id === 'gauntlet');
    for (let i = 0; i < 2; i++) {
      const ws = p.slots[i];
      const slot = el.wslots[i];
      slot.classList.toggle('active', i === p.currentSlot && !!ws);
      slot.classList.toggle('dual-gauntlet', dualGauntlet);
      slot.querySelector('.wslot-name').textContent = ws ? ws.def.name : '空';
      const sub = slot.querySelector('.wslot-sub');
      sub.textContent = ws ? ('伤害 ' + Math.floor(ws.def.damage * p.atkMul)) : '';
    }
  }

  /* 增益栏刷新（事件级：拾取增益时调用）：名称 × 层数，达软上限标注；
     秒杀概率特判显示累计概率（如"秒杀概率 0.3% ×3"，spec 5.3.1 规则 7 双信息） */
  function refreshBuffs(p) {
    const fmt = GAME.DropBuff.fmt;
    const html = [];
    for (const type in p.buffStacks) {
      const def = CONFIG.drops.buffs[type];
      const st = p.buffStacks[type];
      if (!def || st.count <= 0) continue;
      const capped = GAME.DropBuff.isBuffCapped(p, type); // 单一真值源（与候选剔除共用）
      let text = def.name;
      if (type === 'instantKill') text = '秒杀概率 ' + fmt(st.value, true);
      if (type === 'lifesteal') text = '吸血 ' + fmt(st.value, true); // 累计比例展示（bow_staff_lifesteal spec 5.7.1 规则 5a）
      html.push('<span class="buff-chip' + (capped ? ' capped' : '') + '">' + text + ' ×' + st.count + (capped ? '（上限）' : '') + '</span>');
    }
    el.buffBar.innerHTML = html.join('');
    refreshWeapons(p); // 攻击力增益影响武器槽伤害显示
  }

  /* 队友统计刷新（事件级：队友入场 / 清局后调用）：数量与类型构成一次性重建 DOM（spec 5.5.1 规则 11） */
  function refreshMates(player) {
    const mates = GAME.World.mates;
    if (!player || mates.length === 0) { el.mateBar.innerHTML = ''; return; }
    let support = 0, combat = 0;
    for (const m of mates) { if (m.type === 'support') support++; else combat++; }
    el.mateBar.innerHTML = '<span class="mate-chip">队友 ×' + mates.length + ' · 增益 ' + support + ' · 战斗 ' + combat + '</span>';
  }

  /* 提示浮层：CSS 动画自动淡出，animationend 清理节点（无定时器泄漏） */
  function showToast(text, style) {
    const node = document.createElement('div');
    node.className = 'toast toast-' + (style || 'buff');
    node.textContent = text;
    node.style.animationDuration = (CONFIG.ui.toastTime + CONFIG.ui.toastFade) + 's';
    node.addEventListener('animationend', function () { node.remove(); });
    el.toastLayer.appendChild(node);
  }

  return { init: init, showScreen: showScreen, hideAllScreens: hideAllScreens, showHUD: showHUD,
    showStart: showStart, showReplace: showReplace, showGameOver: showGameOver, showBuffChoice: showBuffChoice,
    updateHUD: updateHUD, refreshWeapons: refreshWeapons, refreshBuffs: refreshBuffs, refreshMates: refreshMates,
    buildWeaponCards: buildWeaponCards, showToast: showToast };
})();

/* ============================================================
 * Game 模块：主循环（rAF + dt 钳制）+ 流程状态机 + 局内统计与结算
 * 状态机：BOOT→START→WEAPON_SELECT→LEVEL_INTRO→PLAYING⇄PAUSED
 *       →WEAPON_REPLACE / LEVEL_CLEAR→(普通关)BUFF_CHOICE→进层 / (Boss 关)直接进层
 *       / BUFF_CHOICE(Boss 二选一)→恢复战斗 / GAME_OVER
 * ============================================================ */
GAME.Game = (function () {
  const G = {
    state: 'BOOT', player: null, stats: null, pendingWeapon: null,
    replaceFrom: null, pausedFrom: null, clearT: 0, introT: 0, lastTs: 0, record: null,
    buffChoiceKind: null, buffChoiceFrom: null, // 增益选择：kind('normal'|'boss') + 冻结前状态（同 replaceFrom 生命周期模式）
    pendingBossChoice: false // Boss 二选一挂起标志：被 WEAPON_REPLACE 同帧拦截时置位，替换确认后补发（决策 D4）
  };

  /* ---------------- 初始化 ---------------- */
  function init() {
    GAME.Storage.probe();          // 存储探活（失败降级内存模式）
    GAME.Render.init();
    GAME.Render.resize();
    GAME.Input.init();
    GAME.World.init();
    GAME.UI.init();
    G.record = GAME.Storage.loadRecord();
    GAME.UI.showStart(G.record);   // 开始界面四要素（含最高纪录）
    G.state = 'START';
    /* 首次交互统一解锁音频（一次性拦截，此后移除） */
    const unlock = function () { GAME.AudioSys.unlock(); };
    window.addEventListener('pointerdown', unlock, { once: true });
    window.addEventListener('keydown', unlock, { once: true });
    window.addEventListener('touchstart', unlock, { once: true });
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    requestAnimationFrame(loop);
  }

  /* 画布自适应：resize 后实体位置按新旧宽高比重映射并钳制回场内 */
  function onResize() {
    const oldW = GAME.Render.W, oldH = GAME.Render.H;
    GAME.Render.resize();
    if (!G.player || oldW <= 0 || (oldW === GAME.Render.W && oldH === GAME.Render.H)) return;
    const nw = GAME.Render.W, nh = GAME.Render.H;
    const sx = nw / oldW, sy = nh / oldH;
    function remap(e) { e.x = Utils.clamp(e.x * sx, 0, nw); e.y = Utils.clamp(e.y * sy, 0, nh); }
    remap(G.player);
    for (const e of GAME.World.enemies) remap(e);
    if (GAME.World.boss) remap(GAME.World.boss);
    for (const d of GAME.World.drops) remap(d);
  }

  /* ---------------- 流程接口（状态守卫 + 非法调用忽略并 warn） ---------------- */

  /* 开始界面 → 武器选择界面 */
  function beginSelect() {
    if (G.state !== 'START') return;
    G.state = 'WEAPON_SELECT';
    GAME.UI.showScreen('select');
  }

  /* 开局：初始武器入槽 1，局内统计全零，进入第 1 关 */
  function startRun(weaponId) {
    if (G.state !== 'WEAPON_SELECT') { console.warn('当前状态不可开局: ' + G.state); return; }
    const def = CONFIG.weapons[weaponId];
    if (!def) { console.warn('非法武器 id: ' + weaponId); return; }
    G.player = {
      x: GAME.Render.W / 2, y: GAME.Render.H / 2,
      radius: CONFIG.player.radius,
      hp: CONFIG.player.maxHp, maxHp: CONFIG.player.maxHp,
      aimAngle: -Math.PI / 2, invincibleT: 0,
      speed: CONFIG.player.speed,
      speedMul: 1, atkMul: 1, aspdMul: 1, critRate: 0, regen: 0,
      instantKillRate: 0, // 秒杀概率通道（recalc 全量重算，spec 6.3.1）
      pickupRadius: CONFIG.player.pickupRadius, buffHpAdded: 0,
      slots: [{ def: def, cooldownT: 0 }, null],
      currentSlot: 0, buffStacks: {},
      /* 成长状态（局内临时，不入存档，spec 6.6.1）：等级/经验/升级收益/队友增益（追加于既有字段后） */
      level: CONFIG.growth.initialLevel, exp: 0,
      levelBonus: { atk: 0, aspd: 0, speed: 0, maxhp: 0 },
      mateBonus: { atk: 0, aspd: 0, speed: 0, maxhp: 0 },
      staffGrowth: 0,  // 法杖局内成长（bow_staff_lifesteal D4：每局归零、换枪/暂停保留、禁入存档与全局配置）
      lifestealRate: 0 // 吸血增益通道（recalc 全量重算，rare 增益 lifesteal 累计比例，spec 5.6.1）
    };
    G.stats = { floor: 0, kills: 0, bossKills: 0, usedWeaponIds: [weaponId] };
    GAME.World.reset();
    GAME.LevelGen.reset();
    GAME.UI.hideAllScreens();
    GAME.UI.showHUD(true);
    GAME.UI.refreshWeapons(G.player);
    GAME.UI.refreshBuffs(G.player);
    GAME.UI.refreshMates(G.player); // 队友统计初始化（新局清空展示）
    enterLevel(1);
  }

  /* 进入新关卡：更新层数统计 + LEVEL_INTRO（提示为纯视觉浮层，不冻结战斗） */
  function enterLevel(level) {
    G.stats.floor = level;
    G.state = 'LEVEL_INTRO';
    G.introT = CONFIG.ui.introTime;
    GAME.LevelGen.startLevel(level, G.player);
  }

  /* 切换武器：目标槽为空静默忽略（空槽切换禁止项）；切换不清零任一槽冷却 */
  function switchWeapon(slot) {
    if (G.state !== 'PLAYING' && G.state !== 'LEVEL_INTRO' && G.state !== 'LEVEL_CLEAR') return;
    const idx = slot - 1;
    if (!G.player.slots[idx]) return;
    if (G.player.currentSlot !== idx) {
      G.player.currentSlot = idx;
      GAME.UI.refreshWeapons(G.player);
    }
  }
  /* 移动端切枪按钮：在两个非空槽之间轮换 */
  function swapCycle() {
    const p = G.player;
    if (!p || !p.slots[0] || !p.slots[1]) return;
    switchWeapon(p.currentSlot === 0 ? 2 : 1);
  }

  /* 暂停切换：仅战斗系状态可暂停；暂停冻结全部战斗逻辑与计时 */
  function togglePause() {
    if (G.state === 'PLAYING' || G.state === 'LEVEL_INTRO' || G.state === 'LEVEL_CLEAR') {
      G.pausedFrom = G.state;
      G.state = 'PAUSED';
      GAME.UI.showScreen('pause');
    } else if (G.state === 'PAUSED') {
      G.state = G.pausedFrom || 'PLAYING';
      GAME.UI.hideAllScreens();
    }
  }

  /* Boss 掉落武器且已双持：冻结战斗弹出替换/放弃三选一 */
  function requestWeaponReplace(def) {
    G.pendingWeapon = def;
    G.replaceFrom = G.state;
    G.state = 'WEAPON_REPLACE';
    GAME.UI.showReplace(def, G.player.slots);
  }
  /* 替换确认：slot1/slot2 替换对应槽（新武器冷却从满值开始）/ discard 放弃 */
  function confirmWeaponReplace(choice) {
    if (G.state !== 'WEAPON_REPLACE' || !G.pendingWeapon) { console.warn('当前状态无待确认武器'); return; }
    if (choice === 'slot1' || choice === 'slot2') {
      const idx = choice === 'slot1' ? 0 : 1;
      G.player.slots[idx] = { def: G.pendingWeapon, cooldownT: G.pendingWeapon.cooldown };
      addUsedWeapon(G.pendingWeapon.id);
      GAME.UI.showToast('装备：' + G.pendingWeapon.name, 'buff');
    }
    G.pendingWeapon = null;
    GAME.UI.hideAllScreens();
    GAME.UI.refreshWeapons(G.player);
    G.state = G.replaceFrom || 'PLAYING'; // 恢复冻结前的战斗状态
    G.replaceFrom = null; // 字段生命周期规范：使用后清理（消除残留瑕疵）
    /* Boss 二选一挂起补发（决策 D4）：替换确认恢复战斗态后检查挂起标志——
       补发点在状态恢复之后，此时状态为战斗系，requestBuffChoice 守卫必然通过 */
    if (G.pendingBossChoice) {
      G.pendingBossChoice = false;
      requestBuffChoice('boss');
    }
  }

  /* 请求增益选择（清关三选一 / Boss 二选一共用入口，spec 5.1.1 / 5.2.1）：
     状态守卫——仅战斗系状态可进入；GAME_OVER 时静默跳过（死亡结算优先于二选一，spec 5.2.3 场景 1）
     进入 BUFF_CHOICE 后主循环战斗态守卫集合天然不含该状态 → 战斗/计时/拾取全部冻结（零改动获得冻结） */
  function requestBuffChoice(kind) {
    if (G.state !== 'PLAYING' && G.state !== 'LEVEL_INTRO' && G.state !== 'LEVEL_CLEAR') return false;
    if (!G.stats || !G.player) return false;
    G.buffChoiceKind = kind;
    G.buffChoiceFrom = G.state;
    G.state = 'BUFF_CHOICE';
    const candidates = GAME.DropBuff.rollCandidates(G.player, kind);
    GAME.UI.showBuffChoice(candidates, kind);
    return true; // 返回值改造（决策 D4）：true=已切入 BUFF_CHOICE，false=被守卫拦截（供 onBossDeath 挂起补发判定）
  }
  /* 确认增益选择（卡片点击回调）：状态守卫防连点（spec 5.5.3 场景 2——首次生效即关闭界面）
     normal → 增益生效后直接进下一关（选择与进层原子衔接，spec 5.1.1 规则 3）
     boss   → 增益生效后恢复冻结前战斗态（武器拾取/召唤物清理自然继续，spec 5.2.1 规则 3/4） */
  function confirmBuffChoice(type) {
    if (G.state !== 'BUFF_CHOICE' || !G.buffChoiceKind) { console.warn('当前状态无待确认增益'); return; }
    const kind = G.buffChoiceKind;
    const from = G.buffChoiceFrom; // 修复点：先保存冻结前状态（此前先置空后使用导致恢复值恒为 PLAYING，spec 5.1.1 规则 5）
    GAME.DropBuff.applyBuff(G.player, kind === 'boss' ? 'high' : 'small', type);
    G.buffChoiceKind = null;
    G.buffChoiceFrom = null; // 使用前置空（字段生命周期规范：进入时保存、确认时先读局部变量、再置空、最后使用）
    GAME.UI.hideAllScreens();
    if (kind === 'normal') {
      enterLevel(GAME.LevelGen.L.level + 1); // 三选一生效 → 自动进下一关
    } else {
      G.state = from || 'PLAYING'; // 二选一生效 → 用局部变量恢复冻结前准确战斗态
    }
  }

  /* 重新开始：清空增益/武器/统计/队列/对象池全部实体，回武器选择界面 */
  function restart() {
    if (G.state !== 'PAUSED' && G.state !== 'GAME_OVER') { console.warn('当前状态不可重新开始: ' + G.state); return; }
    G.player = null; G.stats = null; G.pendingWeapon = null;
    G.pausedFrom = null; G.replaceFrom = null;
    G.buffChoiceKind = null; G.buffChoiceFrom = null; // 增益选择状态清理（防残留污染下一局，spec 5.6.1 规则 2）
    G.pendingBossChoice = false; // 挂起标志清理（防跨局残留，决策 D4）
    GAME.World.reset();
    GAME.LevelGen.reset();
    GAME.UI.refreshMates(null); // 队友统计清空（等级/经验/队友禁止跨局保留，spec 5.3.1 规则 9 / 5.5.1 规则 12）
    GAME.UI.hideAllScreens();
    GAME.UI.showHUD(false);
    G.state = 'WEAPON_SELECT';
    GAME.UI.showScreen('select');
  }

  function addUsedWeapon(wid) {
    if (G.stats && G.stats.usedWeaponIds.indexOf(wid) < 0) G.stats.usedWeaponIds.push(wid);
  }

  /* 兑换码校验与发放（spec 5.6.1 规则 2/3/6/8）：全程本地校验零网络请求（spec 4.3.1）。
     返回 { status, msg }——status ∈ 'success'|'empty'|'invalid'|'redeemed'：
     空 → empty；trim+小写化精确匹配失败 → invalid；已兑换 → redeemed（幂等不重复发放）；
     否则持久化 redeemed:true + 重建武器选择卡片（三选一→四选一）→ success。
     持久化失败仅 console.warn 不阻断发放（隐私模式经既有内存降级当场生效，spec 5.6.3 场景 1） */
  function redeemCode(code) {
    const rc = CONFIG.redeem;
    const input = String(code == null ? '' : code).trim();
    if (!input) return { status: 'empty', msg: rc.msgEmpty };
    if (input.toLowerCase() !== rc.code) return { status: 'invalid', msg: rc.msgInvalid };
    const rec = GAME.Storage.loadRecord();
    if (rec.redeemed === true) return { status: 'redeemed', msg: rc.msgRedeemed };
    const result = GAME.Storage.saveRecord({
      version: rec.version, bestFloor: rec.bestFloor, bestKills: rec.bestKills,
      bestBossKills: rec.bestBossKills, redeemed: true
    });
    if (!result.ok) console.warn('兑换状态持久化失败（当场生效，刷新后需重新兑换）');
    GAME.UI.buildWeaponCards(); // 全量重建四选一（天然禁止重复卡片，spec 4.2.8）
    return { status: 'success', msg: rc.msgSuccess };
  }

  /* ---------------- 局内事件钩子 ---------------- */

  /* 敌人死亡结算：粒子爆炸 + 击杀数 + 掉落 roll + 小屏震（由 World.cull 调用） */
  function onEnemyDeath(e) {
    GAME.World.spawnParticles(e.x, e.y, e.def.glowKey, Utils.randInt(CONFIG.fx.enemyDieParticles[0], CONFIG.fx.enemyDieParticles[1]), 160);
    GAME.AudioSys.play('enemyDie');
    GAME.Render.shake(CONFIG.shake.enemyDie);
    G.stats.kills++;
    GAME.DropBuff.rollEnemyDrops(e);
  }

  /* Boss 死亡结算：大型粒子爆炸 + 强屏震 + Boss 数+1 + 必定双掉落（由 World.cull 调用） */
  function onBossDeath(b) {
    GAME.World.spawnParticles(b.x, b.y, 'gold', CONFIG.fx.bossDieParticles, 260);
    /* 二次延时涟漪环（分批粒子产生扩散波感） */
    for (let i = 1; i <= CONFIG.boss.dieRippleCount; i++) {
      setTimeout(function () {
        GAME.World.spawnParticles(b.x, b.y, 'gold', 12, 320);
        GAME.Render.shake(CONFIG.shake.bossHit);
      }, i * 160);
    }
    GAME.AudioSys.play('bossDie');
    GAME.Render.shake(CONFIG.shake.bossDie);
    G.stats.bossKills++;
    GAME.DropBuff.spawnBossWeaponDrop(b); // 必掉武器掉落物（高品质增益由二选一界面发放，spec 5.2.1）
    /* 队友掉落：30% 独立判定（独立随机数，必掉武器与二选一增益零影响，spec 5.5.1 规则 1） */
    if (Math.random() < CONFIG.drops.mate.dropRate) {
      const off = CONFIG.drops.mate.spawnOffset;
      GAME.World.spawnDrop(b.x + Utils.rand(-off, off), b.y + Utils.rand(-off, off), 'mate', null, null);
    }
    /* 拳套第四路掉落：Boss 1% 独立判定（v3 定稿，与必掉武器/队友/二选一三路相互独立，spec 5.2.1 规则 2）；
       插入点在 requestBuffChoice 之前——保证掉落物生成先于界面冻结（冻结期间 DropBuff.update 停摆） */
    if (Math.random() < CONFIG.drops.gauntlet.bossDropRate) {
      const off = CONFIG.drops.gauntlet.spawnOffset;
      GAME.World.spawnDrop(b.x + Utils.rand(-off, off), b.y + Utils.rand(-off, off), 'gauntlet', null, 'gauntlet');
    }
    /* 神弓第五路：Boss 5% 独立判定（bow_staff_lifesteal spec 5.1.1 规则 4a，与既有各路全部相互独立） */
    if (Math.random() < CONFIG.drops.bow.bossDropRate) {
      const off = CONFIG.drops.bow.spawnOffset;
      GAME.World.spawnDrop(b.x + Utils.rand(-off, off), b.y + Utils.rand(-off, off), 'bow', null, 'bow');
    }
    /* 法杖第六路：Boss 30% 独立判定（spec 定稿，同次 Boss 死亡允许与神弓/拳套/队友同时爆出） */
    if (Math.random() < CONFIG.drops.staff.bossDropRate) {
      const off = CONFIG.drops.staff.spawnOffset;
      GAME.World.spawnDrop(b.x + Utils.rand(-off, off), b.y + Utils.rand(-off, off), 'staff', null, 'staff');
    }
    /* Boss 死亡瞬间先弹高品质增益二选一（先于武器拾取，spec 5.2.1 规则 3，决策 B）；
       GAME_OVER 守卫在 requestBuffChoice 内部拦截同帧双死（spec 5.2.3 场景 1）；
       被 WEAPON_REPLACE 同帧拦截（Boss 死亡同帧拾取武器已双持）时挂起补发，防二选一奖励静默丢失（决策 D4） */
    if (!requestBuffChoice('boss')) G.pendingBossChoice = true;
    GAME.World.boss = null; // 召唤小怪仍存活时维持关卡未完成（清关判定含 minions）
  }

  /* 清关事件（LevelGen.tick 检测到全空时调用）——清弹与状态切换解耦为两个独立动作（决策 D1/D2）：
     动作一（清弹）无条件执行——清关判定成立即触发，与当前流程状态无关，同帧界面并发
     （WEAPON_REPLACE/BUFF_CHOICE）时不再被守卫拦截，重复调用幂等（无子弹时为空遍历，spec 5.1.1 规则 1/2）；
     动作二（状态切换）保留守卫——界面冻结态时不切换（待确认恢复后下一帧清关判定自然重触发），
     LEVEL_CLEAR 态时拦截防重复推进（spec 5.1.1 规则 2a） */
  function onLevelClear() {
    /* 动作一：清弹（仅受紧急回退开关约束） */
    if (CONFIG.combat.clearEnemyBulletsOnClear) GAME.World.clearEnemyBullets();
    /* 动作二：状态切换（保留守卫） */
    if (G.state === 'PLAYING' || G.state === 'LEVEL_INTRO') {
      G.state = 'LEVEL_CLEAR';
      G.clearT = CONFIG.ui.clearDelay; // 0.8s 后层数+1 自动推进
    }
  }

  /* 玩家死亡结算：停止战斗 + 汇总统计 + localStorage 纪录比较写入 + 结算界面 */
  function onPlayerDeath() {
    if (G.state === 'GAME_OVER' || !G.stats) return;
    G.state = 'GAME_OVER';
    GAME.World.spawnParticles(G.player.x, G.player.y, 'purple', CONFIG.fx.playerDieParticles, 220);
    GAME.Render.shake(CONFIG.shake.bossDie);
    /* 纪录比较：本局层数更高则更新存档（bestKills/bestBossKills 取历史最大） */
    const rec = GAME.Storage.loadRecord();
    const isNew = G.stats.floor > rec.bestFloor;
    const finalRecord = {
      version: CONFIG.saveVersion,
      bestFloor: Math.max(rec.bestFloor, G.stats.floor),
      bestKills: Math.max(rec.bestKills, G.stats.kills),
      bestBossKills: Math.max(rec.bestBossKills, G.stats.bossKills),
      redeemed: rec.redeemed // 透传兑换状态（防死亡结算写档抹除，design 2.2.2 关键联动点）
    };
    const result = GAME.Storage.saveRecord(finalRecord);
    if (!result.ok) console.warn('最高纪录保存失败（不影响结算流程）');
    else G.record = finalRecord;
    GAME.UI.showHUD(false);
    GAME.UI.showGameOver(G.stats, result.ok ? finalRecord : rec, isNew && result.ok);
  }

  /* ---------------- 主循环 ---------------- */
  function loop(ts) {
    requestAnimationFrame(loop);
    /* deltaTime 钳制：切后台/卡顿返回时防止逻辑大跳变 */
    const dt = Math.min((ts - (G.lastTs || ts)) / 1000, 0.05);
    G.lastTs = ts;
    GAME.Render.tickShake(dt);
    /* 输入轮询：任何状态都消费（边沿字段需复位）；战斗输入仅战斗态使用 */
    const input = GAME.Input.poll(G.player ? G.player.x : 0, G.player ? G.player.y : 0);
    /* 暂停键：仅战斗系状态与暂停态响应（界面态输入穿透禁止） */
    if (input.pausePressed && (G.state === 'PLAYING' || G.state === 'PAUSED' ||
        G.state === 'LEVEL_INTRO' || G.state === 'LEVEL_CLEAR')) {
      togglePause();
    }
    /* 战斗态统一调度（LEVEL_INTRO 不冻结战斗；LEVEL_CLEAR 过渡期继续拾取） */
    if (G.state === 'PLAYING' || G.state === 'LEVEL_INTRO' || G.state === 'LEVEL_CLEAR') {
      if (input.slotPressed) switchWeapon(input.slotPressed);
      if (input.swapPressed) swapCycle();
      updateBattle(dt, input);
      if (G.state === 'LEVEL_INTRO') {
        G.introT -= dt;
        if (G.introT <= 0) G.state = 'PLAYING';
      } else if (G.state === 'LEVEL_CLEAR') {
        G.clearT -= dt;
        if (G.clearT <= 0) {
          /* 清关分流（决策 G）：Boss 关（level%10===0）直接进层不叠加三选一（二选一即该关奖励）；
             普通关弹三选一（选择生效后由 confirmBuffChoice 进下一关，spec 5.1.1 规则 1/3） */
          if (GAME.LevelGen.L.level % 10 === 0) enterLevel(GAME.LevelGen.L.level + 1);
          else requestBuffChoice('normal');
        }
      }
    }
    /* 任何状态都重绘（暂停/替换/结算态画面静止） */
    GAME.Render.drawFrame(G.player);
    GAME.UI.updateHUD(G);
  }

  /* 战斗更新（按依赖序调度各模块） */
  function updateBattle(dt, input) {
    const p = G.player;
    if (!p || p.hp <= 0) return;
    /* 瞄准更新：手动输入（摇杆/活跃窗口内鼠标）优先；无手动输入时自动瞄准最近存活敌人，
       场上无敌人保持上次朝向（禁止方向跳变，spec 5.2.1 规则 3） */
    if (input.aimAngle != null) p.aimAngle = input.aimAngle;
    else {
      const target = GAME.World.findNearestEnemy(p.x, p.y);
      if (target) p.aimAngle = Math.atan2(target.y - p.y, target.x - p.x);
    }
    /* 玩家移动：速度 × 增益系数，钳制竞技场边界（spec 5.7.1 规则 7） */
    p.x += input.moveX * p.speed * p.speedMul * dt;
    p.y += input.moveY * p.speed * p.speedMul * dt;
    p.x = Utils.clamp(p.x, p.radius, GAME.Render.W - p.radius);
    p.y = Utils.clamp(p.y, p.radius, GAME.Render.H - p.radius);
    /* 生命恢复：按每秒回复量结算，封顶最大生命 */
    if (p.regen > 0) p.hp = Math.min(p.hp + p.regen * dt, p.maxHp);
    p.invincibleT = Math.max(0, p.invincibleT - dt);

    GAME.Combat.update(dt, p, input);       // 冷却递减 + 攻击执行（含 bow/staff 分派）
    GAME.Combat.updateZones(dt, p);         // 法阵倒计时与爆发结算（bow_staff_lifesteal，冻结态随守卫自动停摆）
    GAME.Combat.updateBurn(dt, p);          // 灼烧逐帧结算与着火粒子发射（同上冻结停摆）
    GAME.EnemyAI.update(dt, p);             // 敌人 AI
    GAME.BossAI.update(dt, p);              // Boss 行为状态机
    GAME.Mates.update(dt, p);               // 队友跟随与协战（当帧发射的子弹立即进入命中管线）
    GAME.Combat.updateBullets(dt, p);       // 子弹飞行与命中
    GAME.DropBuff.update(dt, p);            // 掉落物吸附与拾取
    GAME.World.updateParticles(dt);         // 粒子
    GAME.World.updateFloatTexts(dt);        // 伤害数字
    GAME.World.updateEffects(dt);           // 攻击特效
    GAME.World.cull();                      // 统一清理与死亡结算
    GAME.LevelGen.tick(dt, p);              // 分批入场 + 清关检测
  }

  return { G: G, init: init, beginSelect: beginSelect, startRun: startRun, switchWeapon: switchWeapon,
    togglePause: togglePause, requestWeaponReplace: requestWeaponReplace, confirmWeaponReplace: confirmWeaponReplace,
    requestBuffChoice: requestBuffChoice, confirmBuffChoice: confirmBuffChoice,
    restart: restart, addUsedWeapon: addUsedWeapon, redeemCode: redeemCode,
    onEnemyDeath: onEnemyDeath, onBossDeath: onBossDeath,
    onLevelClear: onLevelClear, onPlayerDeath: onPlayerDeath };
})();

/* ============================================================
 * 启动入口
 * ============================================================ */
GAME.Game.init();
</script>
</body>
