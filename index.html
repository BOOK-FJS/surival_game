<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>霓虹竞技场 · 俯视角生存闯关</title>
<style>
/* ============================================================
   全局：深色霓虹科技风 · 禁止滚动条红线（spec 5.6.1 规则 9）
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  overflow: hidden; position: fixed; inset: 0; height: 100%;
  background: #0a0e1a; color: #dfe6ff;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  touch-action: none; overscroll-behavior: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
#game-stage { position: fixed; inset: 0; overflow: hidden; }
#game-canvas { position: absolute; inset: 0; display: block; z-index: 0; }

/* ============================================================
   虚拟摇杆与移动端按钮（半透明不遮挡战场，spec 5.6.1 规则 8）
   ============================================================ */
#joysticks { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#zone-left, #zone-right { position: absolute; bottom: 0; height: 58%; width: 50%; display: none; pointer-events: auto; }
#zone-left { left: 0; }
#zone-right { right: 0; }
body.touch #zone-left, body.touch #zone-right { display: block; }
.joy-base {
  position: absolute; width: 120px; height: 120px; border-radius: 50%;
  border: 2px solid rgba(95, 251, 241, 0.45); background: rgba(95, 251, 241, 0.06);
  opacity: 0.35; display: none; transform: translate(-50%, -50%);
}
.joy-knob {
  position: absolute; width: 52px; height: 52px; border-radius: 50%;
  background: rgba(95, 251, 241, 0.32); border: 2px solid rgba(95, 251, 241, 0.7);
  display: none; transform: translate(-50%, -50%);
}
#mobile-buttons { position: absolute; right: 16px; bottom: 178px; display: none; flex-direction: column; gap: 14px; z-index: 12; pointer-events: auto; }
body.touch #mobile-buttons { display: flex; }
.mbtn {
  border-radius: 50%; border: 1px solid rgba(167, 139, 255, 0.7); color: #dfe6ff;
  background: rgba(16, 22, 48, 0.6); font-size: 13px; letter-spacing: 1px; cursor: pointer;
}
#btn-swap { width: 58px; height: 58px; }
#btn-attack {
  width: 78px; height: 78px; font-size: 15px;
  border-color: rgba(95, 251, 241, 0.8); box-shadow: 0 0 14px rgba(95, 251, 241, 0.25);
}
#btn-attack:active { background: rgba(95, 251, 241, 0.22); }

/* ============================================================
   战斗 HUD（层数/生命/武器槽/冷却/增益栏/击杀数/Boss 血条）
   ============================================================ */
#hud { position: absolute; inset: 0; z-index: 20; pointer-events: none; display: none; }
#hud.on { display: block; }
#hud-top { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
.hud-chip {
  background: rgba(10, 16, 38, 0.75); border: 1px solid rgba(0, 240, 255, 0.35);
  border-radius: 8px; padding: 4px 12px; font-size: 14px; letter-spacing: 1px; white-space: nowrap;
}
#boss-bar-wrap { flex: 1; max-width: min(420px, 46vw); margin: 0 auto; display: none; text-align: center; }
#boss-name { font-size: 12px; color: #ffd24d; letter-spacing: 3px; margin-bottom: 3px; text-shadow: 0 0 8px rgba(255, 210, 77, 0.6); }
#boss-bar { height: 10px; border-radius: 5px; background: rgba(30, 24, 10, 0.8); border: 1px solid rgba(255, 210, 77, 0.55); overflow: hidden; }
#boss-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffaa00, #ffe9a3); transform-origin: left; transform: scaleX(1); }
#btn-pause {
  pointer-events: auto; cursor: pointer; margin-left: auto; width: 40px; height: 34px;
  border-radius: 8px; border: 1px solid rgba(0, 240, 255, 0.4); color: #dfe6ff;
  background: rgba(10, 16, 38, 0.75); font-size: 13px;
}
#hud-bottom-left { position: absolute; left: 14px; bottom: 14px; width: min(280px, 44vw); }
#exp-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#lv-badge {
  font-size: 11px; padding: 2px 8px; border-radius: 8px; white-space: nowrap;
  background: rgba(10, 16, 38, 0.75); border: 1px solid rgba(87, 255, 169, 0.5); color: #7dffd4;
}
#exp-bar { flex: 1; height: 10px; border-radius: 5px; background: rgba(10, 30, 24, 0.8); border: 1px solid rgba(87, 255, 169, 0.45); overflow: hidden; }
#exp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2fe08a, #7dffd4); transform-origin: left; transform: scaleX(0); }
#hp-wrap { position: relative; }
#hp-bar { height: 14px; border-radius: 7px; background: rgba(20, 16, 40, 0.8); border: 1px solid rgba(167, 139, 255, 0.55); overflow: hidden; }
#hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #6a5bff, #a78bff); transform-origin: left; transform: scaleX(1); }
#hp-text { position: absolute; left: 0; right: 0; top: -1px; text-align: center; font-size: 11px; line-height: 14px; color: #fff; text-shadow: 0 0 3px #000; }
#mate-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; max-width: 300px; }
#mate-bar:empty { display: none; } /* 无队友时隐藏（spec 5.5.1 规则 11） */
.mate-chip {
  font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap;
  background: rgba(157, 180, 255, 0.12); border: 1px solid rgba(157, 180, 255, 0.5); color: #b8c7ff;
}
#buff-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; max-width: 300px; }
.buff-chip {
  font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap;
  background: rgba(87, 255, 169, 0.1); border: 1px solid rgba(87, 255, 169, 0.45); color: #7dffd4;
}
.buff-chip.capped { border-color: rgba(255, 210, 77, 0.6); color: #ffd24d; }
#weapon-slots { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 10px; }
.weapon-slot {
  width: 92px; height: 62px; border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 10px;
  background: rgba(10, 16, 38, 0.75); position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.weapon-slot.active { border-color: #5ffbf1; box-shadow: 0 0 12px rgba(95, 251, 241, 0.45); }
/* 双持充能拳套叠加标识：品红发光边框（spec 5.5.1 规则 4，延续深色霓虹风格） */
.weapon-slot.dual-gauntlet { border-color: #ff7bd5; box-shadow: 0 0 14px rgba(255, 123, 213, 0.55); }
.weapon-slot.dual-gauntlet .wslot-name { color: #ff7bd5; }
.wslot-key { position: absolute; top: 3px; left: 7px; font-size: 10px; color: #8f9bd8; }
.wslot-name { font-size: 15px; font-weight: 600; letter-spacing: 2px; color: #8f9bd8; }
.weapon-slot.active .wslot-name { color: #5ffbf1; }
.wslot-sub { font-size: 10px; color: #8f9bd8; margin-top: 2px; }
.cd-overlay { position: absolute; left: 0; bottom: 0; width: 100%; height: 0%; background: rgba(0, 0, 0, 0.62); pointer-events: none; }

/* ============================================================
   五大界面（开始 / 武器选择 / 暂停 / 武器替换 / 结算）
   ============================================================ */
#screens { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.screen {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(6, 9, 20, 0.84); pointer-events: auto; overflow-y: auto; touch-action: pan-y;
}
.screen.on { display: flex; }
.panel { text-align: center; padding: 28px 22px; max-width: min(600px, 94vw); }
.game-title {
  font-size: clamp(30px, 7vw, 54px); font-weight: 800; letter-spacing: 6px;
  background: linear-gradient(90deg, #5ffbf1, #a78bff, #ff7bd5);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(95, 251, 241, 0.35));
}
.subtitle { margin-top: 8px; font-size: 14px; color: #8f9bd8; letter-spacing: 4px; }
.help-box { margin: 22px auto 0; max-width: 460px; padding: 14px 18px; border: 1px solid rgba(0, 240, 255, 0.22); border-radius: 12px; background: rgba(12, 18, 40, 0.6); }
.help-box p { font-size: 13px; line-height: 1.9; color: #aab6e8; }
.help-tip { color: #ffd24d !important; }
.best-record { margin-top: 18px; font-size: 15px; color: #7dffd4; letter-spacing: 1px; }
.panel-title { font-size: clamp(22px, 5vw, 30px); font-weight: 700; letter-spacing: 5px; color: #5ffbf1; text-shadow: 0 0 14px rgba(95, 251, 241, 0.5); }
.neon-btn {
  pointer-events: auto; cursor: pointer; margin-top: 22px; padding: 12px 46px;
  font-size: 17px; color: #dfe6ff; background: rgba(10, 16, 38, 0.85);
  border: 1px solid #5ffbf1; border-radius: 10px; letter-spacing: 6px;
  transition: all 0.15s; box-shadow: 0 0 10px rgba(95, 251, 241, 0.25); display: inline-block;
}
.neon-btn:hover { background: rgba(95, 251, 241, 0.15); transform: translateY(-2px); box-shadow: 0 0 18px rgba(95, 251, 241, 0.5); }
.neon-btn:active { transform: translateY(0); }
.neon-btn-sec { border-color: rgba(167, 139, 255, 0.7); box-shadow: 0 0 10px rgba(167, 139, 255, 0.2); }
.neon-btn-sec:hover { background: rgba(167, 139, 255, 0.15); box-shadow: 0 0 18px rgba(167, 139, 255, 0.45); }
.btn-col { display: flex; flex-direction: column; align-items: center; }

/* 兑换码区（spec 5.6.1 规则 1）：次级霓虹按钮 + 内联输入面板（展开/收起无布局跳动） */
.redeem-entry { margin-top: 12px; padding: 8px 30px; font-size: 14px; letter-spacing: 3px; }
.redeem-panel { display: none; margin-top: 12px; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.redeem-panel.on { display: flex; }
.redeem-input {
  pointer-events: auto; width: min(200px, 56vw); padding: 9px 12px; font-size: 14px; letter-spacing: 2px;
  color: #dfe6ff; background: rgba(10, 16, 38, 0.9);
  border: 1px solid rgba(167, 139, 255, 0.7); border-radius: 8px; outline: none;
  user-select: text; -webkit-user-select: text; touch-action: auto; /* 局部覆盖 body 全局禁选（17-18 行），恢复文本交互 */
}
.redeem-input:focus { border-color: #5ffbf1; box-shadow: 0 0 10px rgba(95, 251, 241, 0.35); }
.redeem-panel .neon-btn { margin-top: 0; padding: 8px 18px; font-size: 13px; letter-spacing: 2px; }

/* 武器三选一卡片 */
.weapon-cards { display: flex; gap: 16px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
.weapon-card {
  pointer-events: auto; cursor: pointer; width: min(176px, 30vw); min-width: 128px; padding: 18px 12px;
  border: 1px solid rgba(167, 139, 255, 0.4); border-radius: 12px; background: rgba(16, 22, 48, 0.88);
  transition: all 0.15s; text-align: center;
}
/* 六选一网格（bow_staff_lifesteal D12）：flex-wrap 换行天然支持——桌面容器宽内 3 张换行成 3×2
   （176×3 + gap×2 = 560 ≤ 600 容器宽）；窄屏媒体查询收紧为两列 2×3；禁止横向滚动（spec 决策项 18） */
.weapon-card:hover { border-color: #5ffbf1; transform: translateY(-4px); box-shadow: 0 6px 24px rgba(95, 251, 241, 0.25); }
/* 隐藏武器拳套卡片专属：品红描边 + 光晕 + "隐藏"角标（延续 .bcard-rare 角标模式，spec 5.6.1 规则 4a） */
.weapon-card.hidden-weapon { position: relative; overflow: hidden; border-color: rgba(255, 123, 213, 0.85); }
.weapon-card.hidden-weapon h3 { color: #ff7bd5; }
.wcard-hidden {
  position: absolute; top: 8px; right: -28px; transform: rotate(38deg); width: 110px; text-align: center;
  font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #ff4d5e;
  background: linear-gradient(90deg, rgba(255, 123, 213, 0.9), rgba(255, 200, 240, 0.95));
  padding: 2px 0; box-shadow: 0 0 8px rgba(255, 123, 213, 0.5);
}
.weapon-card h3 { font-size: 19px; letter-spacing: 4px; color: #c9b6ff; }
.wcard-type { display: inline-block; margin-top: 4px; font-size: 11px; color: #5ffbf1; border: 1px solid rgba(95, 251, 241, 0.4); border-radius: 8px; padding: 1px 8px; }
.wcard-desc { margin-top: 10px; font-size: 12px; line-height: 1.7; color: #8f9bd8; min-height: 60px; }
.wcard-stats { margin-top: 8px; font-size: 11px; color: #7dffd4; }

/* 武器替换界面 */
#replace-info { margin-top: 18px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.replace-card { width: 150px; padding: 12px 10px; border-radius: 10px; background: rgba(16, 22, 48, 0.88); border: 1px solid rgba(255, 210, 77, 0.55); }
.replace-card.slot-card { border-color: rgba(143, 155, 216, 0.45); }
.replace-card h4 { font-size: 16px; letter-spacing: 3px; color: #ffd24d; }
.replace-card.slot-card h4 { color: #c9b6ff; }
.replace-card p { margin-top: 6px; font-size: 11px; line-height: 1.7; color: #8f9bd8; }
.rcard-type { display: inline-block; margin-top: 4px; font-size: 10px; color: #5ffbf1; border: 1px solid rgba(95, 251, 241, 0.4); border-radius: 7px; padding: 1px 7px; }
.replace-btns { margin-top: 20px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.replace-btns .neon-btn { margin-top: 0; padding: 10px 20px; font-size: 14px; letter-spacing: 2px; }

/* 结算界面 */
#over-stats { margin: 20px auto 0; max-width: 380px; text-align: left; }
.stat-row { display: flex; justify-content: space-between; gap: 30px; padding: 9px 6px; border-bottom: 1px dashed rgba(143, 155, 216, 0.25); font-size: 15px; }
.stat-row b { color: #5ffbf1; font-weight: 600; }
#over-record { margin-top: 16px; font-size: 15px; color: #7dffd4; }
.new-record { color: #ffd24d; font-weight: 700; letter-spacing: 2px; animation: recBlink 0.7s infinite alternate; }
@keyframes recBlink { from { opacity: 1; text-shadow: 0 0 4px rgba(255, 210, 77, 0.6); } to { opacity: 0.65; text-shadow: 0 0 18px rgba(255, 210, 77, 1); } }

/* ============================================================
   提示浮层（关卡提示 / Boss 提示 / 拾取提示，自动淡出）
   ============================================================ */
#toast-layer {
  position: absolute; top: 16%; left: 0; right: 0; z-index: 40; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.toast { animation: toastAnim 2.3s ease forwards; will-change: opacity, transform; }
.toast-level { font-size: clamp(30px, 6vw, 46px); font-weight: 800; color: #5ffbf1; text-shadow: 0 0 24px rgba(95, 251, 241, 0.8); letter-spacing: 10px; }
.toast-boss { font-size: clamp(34px, 7vw, 54px); font-weight: 800; color: #ffd24d; text-shadow: 0 0 30px rgba(255, 210, 77, 0.95); letter-spacing: 12px; }
.toast-buff { font-size: 15px; color: #7dffd4; background: rgba(10, 20, 30, 0.65); padding: 4px 18px; border-radius: 14px; border: 1px solid rgba(87, 255, 169, 0.4); }
/* 兑换成功专属（决策 D10）：品金渐变大字 + 光晕，反馈强度高于普通拾取 */
.toast-redeem {
  font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: 4px;
  background: linear-gradient(90deg, #ff7bd5, #ffd24d);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(255, 123, 213, 0.6));
}
@keyframes toastAnim {
  0% { opacity: 0; transform: translateY(16px) scale(0.92); }
  10% { opacity: 1; transform: translateY(0) scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-20px); }
}

/* ============================================================
   增益选择界面（三选一/二选一共用；秒杀卡专属"最稀有"样式，spec 5.5.1）
   ============================================================ */
.buff-cards { display: flex; gap: 16px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
.buff-card {
  position: relative; cursor: pointer; width: min(172px, 44vw); min-width: 128px; padding: 18px 12px;
  border: 1px solid rgba(87, 255, 169, 0.4); border-radius: 12px; background: rgba(16, 22, 48, 0.88);
  transition: all 0.15s; text-align: center; overflow: hidden;
}
.buff-card:hover { border-color: #5ffbf1; transform: translateY(-4px); box-shadow: 0 6px 24px rgba(95, 251, 241, 0.25); }
.buff-card h3 { font-size: 18px; letter-spacing: 3px; color: #c9b6ff; }
.bcard-value { margin-top: 6px; font-size: 20px; font-weight: 700; color: #5ffbf1; text-shadow: 0 0 10px rgba(95, 251, 241, 0.5); }
.bcard-tier {
  display: inline-block; margin-top: 6px; font-size: 11px; color: #57ffa9;
  border: 1px solid rgba(87, 255, 169, 0.4); border-radius: 8px; padding: 1px 8px;
}
.bcard-tier.high { color: #ffd24d; border-color: rgba(255, 210, 77, 0.45); }
.bcard-desc { margin-top: 10px; font-size: 12px; line-height: 1.7; color: #8f9bd8; min-height: 56px; }
/* 秒杀最稀有专属：金色边框 + 光晕 + 红色外圈 + 径向金光 + 呼吸动画（仅合成层属性） */
.buff-card.rare {
  border-color: rgba(255, 210, 77, 0.85); outline: 1px solid rgba(255, 77, 94, 0.9); outline-offset: 2px;
  background: radial-gradient(circle at 50% 30%, rgba(255, 210, 77, 0.16), rgba(16, 22, 48, 0.92) 72%);
  animation: rarePulse 1.6s ease-in-out infinite alternate;
}
.buff-card.rare h3 { color: #ffe9a3; }
.buff-card.rare .bcard-value { color: #ffd24d; text-shadow: 0 0 14px rgba(255, 210, 77, 0.8); }
@keyframes rarePulse {
  from { box-shadow: 0 0 10px rgba(255, 210, 77, 0.35); }
  to   { box-shadow: 0 0 26px rgba(255, 210, 77, 0.75); }
}
.bcard-rare {
  position: absolute; top: 8px; right: -30px; transform: rotate(38deg); width: 116px; text-align: center;
  font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #ff4d5e;
  background: linear-gradient(90deg, rgba(255, 210, 77, 0.9), rgba(255, 233, 163, 0.95));
  padding: 2px 0; box-shadow: 0 0 8px rgba(255, 210, 77, 0.5);
}
.bcard-boss-note { margin-top: 8px; font-size: 11px; line-height: 1.6; color: #ffd24d; border-top: 1px dashed rgba(255, 210, 77, 0.3); padding-top: 6px; }
/* 上限回补卡：半透明金边 + 上限说明（选择后数值钳制不变，spec 5.4.3 场景 1） */
.buff-card.capped { opacity: 0.72; border-color: rgba(255, 210, 77, 0.5); }
.bcard-capped-note { margin-top: 8px; font-size: 11px; color: #ffd24d; }

/* 窄屏适配（375px 完美显示） */
@media (max-width: 600px) {
  .hud-chip { font-size: 12px; padding: 3px 9px; }
  #hud-bottom-left { width: min(210px, 46vw); bottom: 96px; }
  #exp-wrap { gap: 6px; margin-bottom: 5px; }
  #lv-badge { font-size: 10px; padding: 1px 6px; }
  #exp-bar { height: 8px; }
  #weapon-slots { bottom: 14px; }
  .weapon-slot { width: 76px; height: 54px; }
  #mobile-buttons { bottom: 148px; }
  .help-box p { font-size: 12px; }
  .buff-card { width: min(164px, 44vw); padding: 14px 10px; }
  .bcard-desc { font-size: 11px; min-height: 48px; }
  .buff-cards { gap: 12px; margin-top: 20px; }
  .redeem-input { width: min(160px, 52vw); padding: 7px 10px; font-size: 13px; }
  .redeem-panel .neon-btn { padding: 7px 14px; font-size: 12px; }
  /* 六选一窄屏两列布局（bow_staff_lifesteal D12，对齐 buff-card 44vw 先例）：卡片收紧 + 描述紧凑 */
  .weapon-card { width: min(160px, 44vw); padding: 14px 10px; }
  .weapon-cards { gap: 12px; margin-top: 20px; }
  .wcard-desc { font-size: 11px; min-height: 52px; margin-top: 8px; }
}
</style>
</head>
<body>
<div id="game-stage">
  <canvas id="game-canvas"></canvas>

  <!-- 移动端虚拟摇杆与按钮（仅触摸设备显示） -->
  <div id="joysticks">
    <div id="zone-left"><div class="joy-base"></div><div class="joy-knob"></div></div>
    <div id="zone-right"><div class="joy-base"></div><div class="joy-knob"></div></div>
    <div id="mobile-buttons">
      <button id="btn-swap" class="mbtn">切枪</button>
      <button id="btn-attack" class="mbtn">攻击</button>
    </div>
  </div>

  <!-- 战斗 HUD：层数/击杀/Boss 血条/暂停 + 生命/增益栏 + 武器槽 -->
  <div id="hud">
    <div id="hud-top">
      <span class="hud-chip" id="hud-floor">第 1 关</span>
      <span class="hud-chip" id="hud-kills">击杀 0</span>
      <div id="boss-bar-wrap">
        <div id="boss-name">BOSS</div>

<script>
'use strict';
/* ============================================================
 * 霓虹竞技场 · 俯视角生存闯关（单文件实现，零外部依赖）
 * 模块依赖序：CONFIG → Utils → Storage → AudioSys → Input → World
 *           → Combat → EnemyAI → BossAI → LevelGen → DropBuff
 *           → Growth → Mates → Render → UI → Game
 * 全部可调参数集中于 CONFIG（调整任一参数无需修改逻辑代码）
 * ============================================================ */
window.GAME = {};

/* ============================================================
 * CONFIG 模块：全部可调参数的唯一真值源（深冻结，只读）
 * ============================================================ */
GAME.CONFIG = (function () {
  const cfg = {
    /* 存档 */

      levelBonus: { atk: 0.04, aspd: 0.02, speed: 0.015, maxhp: 10 } // 每级属性收益
    },

    /* 武器定义：伤害/冷却/范围/特效/音效（三武器差异化，spec 6.2） */
    weapons: {
      knife: {
        id: 'knife', name: '刀', type: 'melee_arc',
        damage: 35, cooldown: 0.35, range: 70,
        arcHalfAngle: 55 * Math.PI / 180, // 扇形半角（弧度）

        desc: '近战扇形挥砍，攻击范围短但攻速快，单体伤害较高，适合贴脸输出。'
      },
      spear: {
        id: 'spear', name: '长枪', type: 'melee_thrust',
        damage: 55, cooldown: 0.65, range: 130, thrustWidth: 30,
        knockback: 140, // 击退初速（px/s，约 0.15s 衰减）

        desc: '近战直线突刺，攻击距离比刀更长、范围窄，伤害高并附带轻微击退。'
      },
      pistol: {
        id: 'pistol', name: '手枪', type: 'ranged',
        damage: 22, cooldown: 0.5, range: 999,
        bulletSpeed: 620, bulletLife: 1.2, bulletRadius: 4,
        sfx: 'shoot', color: '#ffe14d',
        desc: '远程单发子弹，射速中等、伤害中等，可远距离安全攻击。'
      },
      /* 隐藏武器"充能拳套"（spec 6.1 定稿/建议值，全部可调）：中速近战 · 群伤清屏——
         冷却与手枪同档（慢于刀 0.35s、快于长枪 0.65s），伤害低于刀高于手枪，

      gauntlet: {
        id: 'gauntlet', name: '充能拳套', type: 'melee_chain',
        damage: 30,                        // 单跳伤害（可调）
        cooldown: 0.5,                     // 攻击冷却（v3 定稿，可调）
        range: 70,                         // 首目标扇形半径（与刀一致，可调）
        arcHalfAngle: 55 * Math.PI / 180,  // 扇形半角（与刀一致，可调）
        chainMaxTargets: 5,                // 连锁人数上限（含首目标，可调）
        chainJumpRange: 180,               // 连锁跳跃最大目标间距离（可调）
        lifestealPerHit: 0.01,             // 每命中一人吸血 1% 最大生命（可调）
        dualChainMultiplier: 2,            // 双持叠加：连锁上限 ×2（5→10），吸血不变（方案 A 定稿）
        hidden: true,                      // 隐藏武器标记（不入 Boss 必掉池、专属拾取提示）
        sfx: 'gauntletSwing', color: '#ff7bd5',
        desc: '隐藏武器。近战能量冲击，命中后连锁至多 5 名敌人（双持翻倍至 10 名），每命中一人回复 1% 最大生命。'
      },
      /* 隐藏武器"落日神弓"（bow_staff_lifesteal spec 决策项 1~6，全部可调）：远程 · 多向箭雨——
         冷却 1.0s 慢输出换高爆发；五向 40° 对称扇形，单箭伤害 200（暴击/秒杀/掉落走子弹管线自动联动）；
         命中附带 3s 灼烧（40/s、0.5s 一跳、刷新不叠加、对 Boss 生效）；双持箭数 ×2（5→10，方案 A 同构拳套） */
      bow: {
        id: 'bow', name: '落日神弓', type: 'ranged_multi',
        damage: 200,                       // 单箭伤害（可调）

        arrowCount: 5,                     // 单持箭数（可调）
        spreadTotal: 40 * Math.PI / 180,   // 扇形总夹角 40°（对称分布于瞄准方向两侧，可调）
        bulletSpeed: 620, bulletLife: 1.2, bulletRadius: 5,
        dualArrowMultiplier: 2,            // 双持叠加：箭数 ×2（5→10），灼烧参数不变

        desc: '隐藏武器。向五个方向射出箭矢（双持翻倍至十支），每支伤害 200 并附带 3 秒灼烧（每秒 40 伤害，对 Boss 生效）。'
      },
      /* 隐藏武器"起源法杖"（spec 决策项 7~11，含用户定稿成长上限 +5000）：远程 · 法阵——
         冷却 0.5s 高频施法；法阵 0.3s 预警后对半径 90 范围爆发；每命中一名敌人本局伤害永久 +1
         （上限 +5000，双持成长速率 ×2 不抬上限）；施法位置 = 鼠标活跃窗口内取鼠标点，否则瞄准方向 × 240 */
      staff: {
        id: 'staff', name: '起源法杖', type: 'zone_cast',
        damage: 80,                        // 法阵基础伤害（可调；爆发基数 = 基础 + staffGrowth）
        cooldown: 0.5,                     // 攻击冷却（spec 定稿 0.5，可调）
        castDistance: 240,                 // 无鼠标输入时的施法距离（沿瞄准方向，可调）
        zoneRadius: 90,                    // 法阵判定半径（可调）
        zoneDelay: 0.3,                    // 预警到爆发的延迟秒数（可调）
        growthPerHit: 1,                   // 每命中一名敌人的局内成长值（可调）
        growthCap: 5000,                   // 局内成长上限（用户定稿 +5000；软性数值安全网，实际增速受命中频率自然约束）
        dualGrowthMultiplier: 2,           // 双持叠加：成长速率 ×2（每命中 +2），上限不抬高（v2 定稿）
        hidden: true,                      // 隐藏武器标记
        sfx: 'staffCast', sfxGet: 'staffGet', color: '#a78bff',
        desc: '隐藏武器。在指定区域生成法阵，0.3 秒后爆发造成范围伤害；每命中一名敌人本局伤害永久 +1（上限 +5000，双持成长翻倍）。'
      }
    },

    /* 战斗通用参数 */
    combat: {
      critMultiplier: 1.8,   // 暴击伤害倍率
      angleTolerance: 0.12,  // 扇形判定的角度容差（容纳敌人自身半径，弧度）
      knockDecay: 12,        // 击退速度指数衰减系数
      minCooldown: 0.15,     // 攻速增益下的冷却下限
      bulletMargin: 60,      // 子弹出界回收的边界外余量（elite_bullet_cull 后仅由玩家/队友子弹消费：60 > 敌人屏外生成偏移 40，保证火力覆盖刚入场还挂在屏缘外的敌人，design D7）
      /* 自动瞄准（决策 D3）：窗口过短会抢占手动方向、过长则桌面端自动瞄准不可达，1.2s 为平衡值 */
      autoAim: { mouseActiveWindow: 1200 },
      /* 清关清弹开关：清关判定成立时清除全部敌方子弹（仅作紧急回退用） */
      clearEnemyBulletsOnClear: true,
      /* 敌方子弹出屏即逝开关（elite_bullet_cull spec 5.2.1 规则 1）：true 时敌方子弹按弹体
         自身半径"完全出屏"口径当帧回收；false 为紧急回退（与玩家/队友共用 bulletMargin 统一口径，即既有行为） */
      enemyBulletTightCull: true,
      /* 屏外发射抑制开关（elite_bullet_cull spec 5.2.1 规则 2）：true 时发射者（精英/Boss）中心

      enemyOffscreenFireBlock: true,

      fireGraceTime: 2.0
    },

    /* 敌人定义与成长曲线（spec 6.3） */
    enemies: {
      defs: {
        /* dropRate 爆率已下调至约 1%（spec_rebalance）：清关三选一为增益主通道，小掉落降级为低频惊喜；精英保持 2 倍差异化 */
        melee_normal:  { key: 'melee_normal',  name: '普通近战', hpBase: 42, speedBase: 95,  touchDamage: 12, attackInterval: 0.8, radius: 13, dropRate: 0.01, color: '#ff4d5e', glowKey: 'red',    shape: 'triangle', ranged: false },
        melee_fast:    { key: 'melee_fast',    name: '快速近战', hpBase: 25, speedBase: 152, touchDamage: 8,  attackInterval: 0.6, radius: 10, dropRate: 0.01, color: '#ff7a6e', glowKey: 'red',    shape: 'dart',     ranged: false },
        ranged_normal: { key: 'ranged_normal', name: '普通远程', hpBase: 38, speedBase: 80,  bulletDamage: 10, shootInterval: 2.2, bulletSpeed: 260, bulletRadius: 5, rangeMin: 260, rangeMax: 420, dropRate: 0.01, color: '#ff9d33', glowKey: 'orange', shape: 'circle', ranged: true,
          bulletLife: 4 }, // 已下线（elite_bullet_cull spec 5.1.1 规则 2 方案 b），恢复：mix.rangedNormal 改回 8；保留 bulletLife 保证回滚后射击寿命与改前一致
        ranged_elite:  { key: 'ranged_elite',  name: '精英远程', hpBase: 84, speedBase: 70,  bulletDamage: 14, shootInterval: 1.5, bulletSpeed: 340, bulletRadius: 5, rangeMin: 300, rangeMax: 480, burstCount: 3, burstSpread: 8 * Math.PI / 180, dropRate: 0.02, color: '#ffb640', glowKey: 'orange', shape: 'hex', ranged: true, radius: 17,
          bulletLife: 4 } // 敌方子弹寿命参数化提取（取值不变，design D5）；来源收缩后唯一普通敌人弹源
      },
      /* 成长曲线：数量/生命/移速/攻频均为层数增函数（spec 5.3.1 规则 5） */
      growth: {
        countBase: 5, countPerLevel: 1.2,   // 数量 = 5 + floor(层×1.2)
        hpPerLevel: 0.14,                    // 生命 ×(1+0.14N)（rebalance：0.12→0.14 微调克制）
        speedPerLevel: 0.04, speedCap: 0.8,  // 移速 ×(1+min(0.04N, 0.8))
        fireRatePerLevel: 0.03,              // 射击冷却 ×1/(1+0.03N)
        /* 伤害成长（rebalance 新增维度，spec_rebalance 6.2.5）：伤害 ×(1+min(0.02N, 1.0))，第 50 层封顶翻倍 */
        damagePerLevel: 0.02, damageCap: 1.0

      /* 类型混入阈值：低层以普通近战为主，逐层混入新类型（elite_bullet_cull 修订，design D1/D2）：
         rangedNormal 置 Infinity = 普通远程已下线（spec 5.1.1 规则 2 方案 b，配置驱动下线——
         rollType 的 level >= Infinity 恒为 false，逻辑零改动；恢复出场改回 8 即可）；
         rangedElite 15 → 11 = 精英第 11 关起混入（第 10 关为 Boss 关不构造波次，阈值写 10 与 11
         实际等效，取 11 语义精确；补偿第 8~9 关纯近战空窗的难度） */
      mix: { fast: 5, rangedNormal: Infinity, rangedElite: 11 },
      /* 四边生成与分批入场 */
      spawn: {
        offset: 40,            // 生成点在边界外的偏移

    /* Boss 定义（金色，每 10 关出现，spec 6.4） */
    boss: {
      baseHp: 900, hpExponent: 1.35,        // hp = 900 × 序号^1.35
      radius: 34,

      spawnTime: 1.0,                        // 出生演出时长（无敌）

      /* Boss 本体伤害成长（rebalance 新增，spec_rebalance 6.3）：接触/冲锋 ×(1+0.08×(序号-1))，与追击速度成长同构，不封顶 */
      touchDamagePerIndex: 0.08, chargeDamagePerIndex: 0.08,

      volleyHalfAngle: 0.7,                  // 弹幕扇形半角
      volleySpeed: 300, volleySpeedPerIndex: 12,
      volleyDamage: 15, volleyDamagePerIndex: 2,

      minionSafeDistance: 220,
      lastSkillPenalty: 0.3,                 // 防连发：同类刚用过的技能权重乘数
      hitShakeTime: 0.15, hitShakeAmp: 4,    // 受击震动（仅视觉偏移）

      burnFlameA: '#ff5a3c', burnFlameB: '#ff9d33', burnSpark: '#ffc06a', burnAsh: '#8a7a72',
      zoneWarn: '#a78bff', zoneBurst: '#c9b6ff', zoneFlash: '#f2ecff',
      glow: { cyan: '#5ffbf1', red: '#ff5566', orange: '#ff9933', gold: '#ffd24d', purple: '#a78bff', white: '#ffffff',
        mint: '#57ffa9', pink: '#ff6e8a', ice: '#9db4ff', magenta: '#ff7bd5',
        sunset: '#ffb640', burnFlameA: '#ff5a3c', burnFlameB: '#ff9d33', burnSpark: '#ffc06a',
        burnAsh: '#8a7a72', zoneBurst: '#c9b6ff' }

  /* 深冻结：运行期只读，调参需改此处（对应"参数集中管理"约束） */
  function deepFreeze(o) {
    if (o && typeof o === 'object') {

/* ============================================================
 * Utils 模块：纯函数工具库（三套碰撞数学 + 数学/随机，无副作用）
 * ============================================================ */
GAME.Utils = (function () {
  const U = {};
  U.clamp = function (v, min, max) { return v < min ? min : (v > max ? max : v); };
  U.distSq = function (ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
  /* 圆-圆碰撞（子弹↔实体、玩家↔敌人接触、玩家↔掉落物）：距离平方比较规避开方 */
  U.circleHit = function (ax, ay, ar, bx, by, br) {
    const r = ar + br;
    return U.distSq(ax, ay, bx, by) < r * r;
  };
  /* 角度规范化到 (-π, π]（处理跨 ±π 边界） */
  U.normalizeAngle = function (a) {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a <= -Math.PI) a += 2 * Math.PI;
    return a;
  };
  /* 扇形-圆判定（刀挥砍）：距离条件 + 角度条件（含容纳敌人半径的角度容差） */
  U.sectorHit = function (px, py, aim, halfAngle, range, ex, ey, er) {
    const dx = ex - px, dy = ey - py, lenSq = dx * dx + dy * dy, rr = range + er;
    if (lenSq >= rr * rr) return false;          // 条件1：距离在攻击半径内
    if (lenSq < 1e-6) return true;               // 圆心重合必然命中
    const ang = Math.atan2(dy, dx);
    return Math.abs(U.normalizeAngle(ang - aim)) < halfAngle + GAME.CONFIG.combat.angleTolerance; // 条件2：角度
  };
  /* 矩形-圆判定（长枪突刺）：轴向投影法，全部标量运算规避开方 */
  U.rectHit = function (px, py, aim, length, halfWidth, ex, ey, er) {
    const dx = ex - px, dy = ey - py;
    const cos = Math.cos(aim), sin = Math.sin(aim);
    const ax = dx * cos + dy * sin;            // 沿突刺方向的投影长度
    const ay = Math.abs(-dx * sin + dy * cos); // 垂直突刺方向的偏移绝对值
    return ax > -er && ax < length + er && ay < halfWidth + er;
  };
  U.rand = function (min, max) { return min + Math.random() * (max - min); };
  U.randInt = function (min, max) { return Math.floor(U.rand(min, max + 1)); };
  /* 按权重随机选取一项：items = [{key, weight}, ...] */
  U.pickWeighted = function (items) {
    let total = 0;
    for (const it of items) total += it.weight;
    let r = Math.random() * total;
    for (const it of items) { r -= it.weight; if (r <= 0) return it.key; }
    return items[items.length - 1].key;
  };
  return U;
})();
const CONFIG = GAME.CONFIG, Utils = GAME.Utils;

/* ============================================================
 * Storage 模块：localStorage 单键容错读写（探活 + 校验 + 回读比对）
 * 异常不外抛、结果对象表达成败（存档容错红线 spec 4.2.1 / 5.8.3）
 * ============================================================ */
GAME.Storage = (function () {
  const KEY = CONFIG.storageKey;
  const mem = defaultRecord(); // 隐私模式降级用的内存纪录
  let persist = true;

  function defaultRecord() {
    return { version: CONFIG.saveVersion, bestFloor: 0, bestKills: 0, bestBossKills: 0, redeemed: false };
  }
  function validNum(n) {
    return typeof n === 'number' && isFinite(n) && n >= 0 && Math.floor(n) === n;
  }
  /* 启动探活：写探针 → 回读 → 删除；失败则整体降级为内存模式 */
  function probe() {
    try {
      const k = KEY + ':probe';
      localStorage.setItem(k, '1');
      const ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      persist = ok;
    } catch (e) { persist = false; }
    if (!persist) console.warn('localStorage 不可用，最高纪录仅保存在本次会话中');
  }
  /* 读取：try-catch + JSON 解析 + 逐字段类型校验，任一失败回退默认值 */
  function loadRecord() {
    if (!persist) return Object.assign({}, mem);
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaultRecord();
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object' || !validNum(d.bestFloor) || !validNum(d.bestKills) || !validNum(d.bestBossKills)) {
        return defaultRecord(); // 篡改/损坏兜底
      }
      /* redeemed 兑换状态：字段缺失/非法按未兑换兜底（旧存档零破坏，spec 4.5.3 / 5.6.1 规则 5a） */
      return { version: CONFIG.saveVersion, bestFloor: d.bestFloor, bestKills: d.bestKills, bestBossKills: d.bestBossKills,
        redeemed: typeof d.redeemed === 'boolean' ? d.redeemed : false };
    } catch (e) { return defaultRecord(); }
  }
  /* 写入：setItem + 回读比对；失败仅 console.warn，不中断调用方流程 */
  function saveRecord(rec) {
    if (!persist) { Object.assign(mem, rec); return { ok: true, persisted: false }; }
    try {
      const s = JSON.stringify(rec);
      localStorage.setItem(KEY, s);
      if (localStorage.getItem(KEY) !== s) return { ok: false, persisted: false };
      return { ok: true, persisted: true };
    } catch (e) { return { ok: false, persisted: false }; }
  }
  return { probe, loadRecord, saveRecord };
})();

/* ============================================================
 * AudioSys 模块：WebAudio 合成音效（延迟初始化 + 失败自禁用）
 * tone 扫频原语 + noise 滤波噪声原语，零外部音频文件
 * ============================================================ */
GAME.AudioSys = (function () {
  let ctx = null, master = null, noiseBuf = null, disabled = false;
  const lastPlay = {};

  /* 首次用户交互时调用：创建并 resume AudioContext（音频容错 spec 4.2.4） */
  function unlock() {
    if (ctx || disabled) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { disabled = true; return; }
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = CONFIG.audio.masterVolume;
      master.connect(ctx.destination);
      /* 预生成一次白噪声缓冲（0.5s），后续播放即用即弃 */
      const len = Math.floor(ctx.sampleRate * CONFIG.audio.noiseDuration);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { disabled = true; }
  }

  /* 音调原语：振荡器对数扫频 + 增益短包络（5ms 起音 → 指数衰减） */
  function tone(spec, t0) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = spec.wave;
    osc.frequency.setValueAtTime(Math.max(1, spec.f0), t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, spec.f1), t0 + spec.dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(spec.vol, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + spec.dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + spec.dur + 0.02);
    osc.onended = function () { try { osc.disconnect(); g.disconnect(); } catch (e) {} };
  }

  /* 噪声原语：BufferSource + 双二阶滤波（频率可扫） + 增益包络 */
  function noise(spec, t0) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const flt = ctx.createBiquadFilter();
    flt.type = spec.wave; // 配置中 wave 字段对噪声即滤波器类型
    flt.frequency.setValueAtTime(Math.max(40, spec.f0), t0);
    if (spec.f1 && spec.f1 !== spec.f0) flt.frequency.exponentialRampToValueAtTime(Math.max(40, spec.f1), t0 + spec.dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(spec.vol, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + spec.dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + spec.dur + 0.02);
    src.onended = function () { try { src.disconnect(); flt.disconnect(); g.disconnect(); } catch (e) {} };
  }

  /* 播放入口：未初始化静默直通；同名音效 60ms 节流防叠加爆音 */
  function play(name) {
    if (disabled || !ctx) return;
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    const now = performance.now();
    if (lastPlay[name] && now - lastPlay[name] < CONFIG.audio.throttle * 1000) return;
    lastPlay[name] = now;
    const parts = CONFIG.audio.sfx[name];
    if (!parts) { console.warn('未知音效: ' + name); return; }
    const t0 = ctx.currentTime + 0.001;
    for (const p of parts) (p.src === 'tone' ? tone : noise)(p, t0 + (p.delay || 0));
  }
  return { unlock, play };
})();

/* ============================================================
 * Input 模块：键鼠 + 触摸双通道统一输入抽象
 * 输出契约 InputState：{moveX, moveY, aimAngle|null, attackHeld,
 *   pausePressed, slotPressed, swapPressed}（边沿字段 poll 后复位）
 * ============================================================ */
GAME.Input = (function () {
  const STICK_MAX = 45, DEAD = 0.25; // 摇杆最大偏移半径 / 死区阈值
  const keyTimes = {};               // 按键按下时间戳（冲突方向"后按优先"依据）
  let mouseDown = false, spaceDown = false, mouseMoved = false, mouseX = 0, mouseY = 0;
  let mouseAimT = 0; // 鼠标瞄准活跃时间戳（静止超窗后让位自动瞄准）
  let slotPressed = 0, pausePressed = false, swapPressed = false;
  let attackBtnHeld = false, stickAim = null;
  const moveStick = { id: null, cx: 0, cy: 0, vx: 0, vy: 0 }; // 左摇杆（移动）
  const aimStick = { id: null, cx: 0, cy: 0, vx: 0, vy: 0 };  // 右摇杆（瞄准+自动攻击）
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  function onKeyDown(e) {
    /* 输入框聚焦隔离（决策 D11）：兑换码输入框键入期间游戏按键整体跳过——
       空格不再被 preventDefault 吞掉、切枪/暂停在输入态无副作用 */
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!e.repeat) {
      keyTimes[e.code] = performance.now();
      if (e.code === 'Space') spaceDown = true;
      if (e.code === 'Digit1') slotPressed = 1;
      if (e.code === 'Digit2') slotPressed = 2;
      if (e.code === 'Escape' || e.code === 'KeyP') pausePressed = true;
    }
    if (e.code === 'Space') e.preventDefault(); // 阻止空格默认滚动
  }
  function onKeyUp(e) {
    delete keyTimes[e.code];
    if (e.code === 'Space') spaceDown = false;
  }
  /* 冲突方向键（A+D / 左+右）"后按优先"：取按下时间戳更新的方向 */
  function axis(neg1, pos1, neg2, pos2) {
    const n = Math.max(keyTimes[neg1] || 0, keyTimes[neg2] || 0);
    const p = Math.max(keyTimes[pos1] || 0, keyTimes[pos2] || 0);
    if (n === 0 && p === 0) return 0;
    if (n === 0) return 1;
    if (p === 0) return -1;
    return n > p ? -1 : 1;
  }
  /* 跟随式虚拟摇杆：以落点为动态圆心，pointerId 隔离多点触控 */
  function bindStick(zone, stick, isAim) {
    const base = zone.querySelector('.joy-base');
    const knob = zone.querySelector('.joy-knob');
    function updateKnob() {
      knob.style.left = (stick.cx + stick.vx * STICK_MAX) + 'px';
      knob.style.top = (stick.cy + stick.vy * STICK_MAX) + 'px';
    }
    zone.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'touch' || stick.id !== null) return; // 每杆单指
      e.preventDefault();
      stick.id = e.pointerId;
      stick.cx = e.clientX; stick.cy = e.clientY;
      try { zone.setPointerCapture(e.pointerId); } catch (err) {}
      base.style.display = 'block';
      base.style.left = stick.cx + 'px'; base.style.top = stick.cy + 'px';
      knob.style.display = 'block';
      updateKnob();
    });
    zone.addEventListener('pointermove', function (e) {
      if (e.pointerId !== stick.id) return;
      e.preventDefault();
      let dx = e.clientX - stick.cx, dy = e.clientY - stick.cy;
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len > STICK_MAX) { dx = dx / len * STICK_MAX; dy = dy / len * STICK_MAX; } // 偏移钳制最大半径
      stick.vx = dx / STICK_MAX; stick.vy = dy / STICK_MAX;
      if (isAim) { // 右摇杆：死区外即瞄准并自动攻击，归位即停止
        const mag = Math.sqrt(stick.vx * stick.vx + stick.vy * stick.vy);
        stickAim = mag > DEAD ? Math.atan2(stick.vy, stick.vx) : null;
      }
      updateKnob();
    });
    const end = function (e) {
      if (e.pointerId !== stick.id) return;
      stick.id = null; stick.vx = 0; stick.vy = 0;
      if (isAim) stickAim = null;
      base.style.display = 'none'; knob.style.display = 'none';
    };
    zone.addEventListener('pointerup', end);
    zone.addEventListener('pointercancel', end);
  }

  function init() {
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('mousemove', function (e) { mouseX = e.clientX; mouseY = e.clientY; mouseMoved = true; mouseAimT = performance.now(); });
    window.addEventListener('mousedown', function (e) { if (e.button === 0) mouseDown = true; });
    window.addEventListener('mouseup', function (e) { if (e.button === 0) mouseDown = false; });
    window.addEventListener('blur', function () { // 失焦清键，防按键卡死
      for (const k in keyTimes) delete keyTimes[k];
      mouseDown = false; spaceDown = false;
    });
    bindStick(document.getElementById('zone-left'), moveStick, false);
    bindStick(document.getElementById('zone-right'), aimStick, true);
    /* 移动端按钮：攻击按钮（按当前朝向攻击）与切枪按钮（轮换） */
    const ba = document.getElementById('btn-attack');
    ba.addEventListener('pointerdown', function (e) { e.preventDefault(); attackBtnHeld = true; });
    ba.addEventListener('pointerup', function () { attackBtnHeld = false; });
    ba.addEventListener('pointercancel', function () { attackBtnHeld = false; });
    ba.addEventListener('pointerleave', function () { attackBtnHeld = false; });
    document.getElementById('btn-swap').addEventListener('pointerdown', function (e) { e.preventDefault(); swapPressed = true; });
    /* 触摸检测仅决定摇杆初始显隐，键鼠事件始终监听（混用兼容） */
    if (isTouchDevice) document.body.classList.add('touch');
  }

  /* 统一出口：双通道合并（移动向量求和后归一化；瞄准取最近触发的通道） */
  function poll(px, py) {
    let mx = axis('KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight') + moveStick.vx;
    let my = axis('KeyW', 'KeyS', 'ArrowUp', 'ArrowDown') + moveStick.vy;
    const len = Math.sqrt(mx * mx + my * my);
    if (len > 1) { mx /= len; my /= len; }
    let aim = null;
    if (stickAim != null) aim = stickAim;                       // 右摇杆优先
    /* 鼠标瞄准：仅活跃窗口内输出（手动优先）；静止超窗后 aimAngle 置 null 让位自动瞄准 */
    else if (mouseMoved && performance.now() - mouseAimT < CONFIG.combat.autoAim.mouseActiveWindow) {
      aim = Math.atan2(mouseY - py, mouseX - px);
    }
    const attackHeld = mouseDown || spaceDown || attackBtnHeld || stickAim != null;
    const out = { moveX: mx, moveY: my, aimAngle: aim, attackHeld: aim != null ? attackHeld : attackHeld, pausePressed: pausePressed, slotPressed: slotPressed, swapPressed: swapPressed };
    pausePressed = false; slotPressed = 0; swapPressed = false; // 边沿字段每帧至多消费一次
    return out;
  }
  /* 鼠标指针状态只读导出（bow_staff_lifesteal D5）：法杖施法位置的信号源——
     active 与 poll 内瞄准分轨完全同源同判（mouseMoved && 活跃窗口内），
     x/y 为当前鼠标 clientX/Y（Canvas 满屏固定定位，即游戏逻辑坐标）；纯只读无副作用 */
  function pointerState() {
    return {
      active: !!(mouseMoved && performance.now() - mouseAimT < CONFIG.combat.autoAim.mouseActiveWindow),
      x: mouseX, y: mouseY
    };
  }
  return { init, poll, isTouchDevice: isTouchDevice, pointerState: pointerState };
})();

/* ============================================================
 * World 模块：实体容器 + 对象池 + 统一清理
 * 子弹/粒子/浮字启动时预分配满容量，active 标志复用（稳态零分配）
 * ============================================================ */
GAME.World = (function () {
  const W = {
    enemies: [], boss: null, bullets: [], particles: [], floatTexts: [], drops: [], effects: [],
    mates: [], // 队友容器（无生命纯辅助，数量无上限，不入 limits 池体系——决策 D8）
    zones: [], // 法阵实体容器（动态数组，bow_staff_lifesteal D3：并存数受"0.3s 寿命 × 0.15s 冷却下限"自然约束 ≤3，不入池体系）
    bulletPool: [], particlePool: [], floatTextPool: []
  };

  function init() {
    for (let i = 0; i < CONFIG.limits.maxBullets; i++) {
      W.bulletPool.push({ active: false, owner: 'player', x: 0, y: 0, vx: 0, vy: 0, damage: 0, radius: 4, life: 0, style: 'player', trail: [] });
    }
    for (let i = 0; i < CONFIG.limits.maxParticles; i++) {
      W.particlePool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 2, colorKey: 'white' });
    }
    for (let i = 0; i < CONFIG.limits.maxFloatTexts; i++) {
      W.floatTextPool.push({ active: false, x: 0, y: 0, vy: 0, life: 0, text: '', isCrit: false, style: 'normal' });
    }
  }
  function reset() {
    W.enemies.length = 0; W.boss = null; W.drops.length = 0; W.effects.length = 0;
    W.mates.length = 0; // 局级清空队友（禁止跨局保留，spec 5.5.1 规则 12）
    W.zones.length = 0; // 局级清空法阵（禁止跨局残留，bow_staff_lifesteal spec 4.2 红线）
    for (const b of W.bulletPool) b.active = false;
    for (const p of W.particlePool) p.active = false;
    for (const f of W.floatTextPool) f.active = false;
    W.bullets.length = 0; W.particles.length = 0; W.floatTexts.length = 0;
  }

  /* 子弹出生入口：池耗尽返回 null 拒绝生成（上限策略 spec 4.1.2） */
  function spawnBullet(owner, x, y, angle, speed, damage, radius, style, life) {
    let b = null;
    for (const cand of W.bulletPool) { if (!cand.active) { b = cand; break; } }
    if (!b) return null;
    b.active = true; b.owner = owner; b.x = x; b.y = y;
    b.vx = Math.cos(angle) * speed; b.vy = Math.sin(angle) * speed;
    b.damage = damage; b.radius = radius; b.style = style; b.life = life;
    b.trail.length = 0;
    W.bullets.push(b);
    return b;
  }
  /* 粒子爆炸：超额时静默复用最旧粒子（裁剪上限策略）
     第 6 参 opts 定向锥扩展（bow_staff_lifesteal D18）：缺省 undefined 完全走既有全向随机路径
     （既有全部调用零改动）；提供 opts 时每颗粒子速度 = 定向基速 (vx,vy) + 既有全向随机散布的矢量
     合成（火焰上飘/火星轻抛/灰烬弱抛的锥形发射）；lifeMul/sizeMul 为寿命与初始尺寸乘数，
     spawn 时一次性消费、落池即既有字段集（池更新/绘制/回收零改动）；字段缺失逐项缺省兜底 */
  function spawnParticles(x, y, colorKey, count, power, opts) {
    const vx0 = opts && typeof opts.vx === 'number' && isFinite(opts.vx) ? opts.vx : 0;
    const vy0 = opts && typeof opts.vy === 'number' && isFinite(opts.vy) ? opts.vy : 0;

      const sp = Utils.rand(0.25, 1) * power;

      burst: CONFIG.fx.burstLife, burstAfter: CONFIG.fx.burstAfterLife };

  W.clearEnemyBullets = clearEnemyBullets;

/* ============================================================
 * Combat 模块：武器攻击执行 / 独立冷却 / 暴击结算 / 子弹命中判定
 * ============================================================ */

  const World = GAME.World;

  /* 每帧：两武器槽独立冷却递减 + 攻击意图执行（冷却未结束忽略输入） */
  function update(dt, player, input) {
    for (const ws of player.slots) { if (ws && ws.cooldownT > 0) ws.cooldownT = Math.max(0, ws.cooldownT - dt); }
    if (input.attackHeld) {

    if (!ws || ws.cooldownT > 0) return false; // 独立冷却规则（spec 5.2.1 规则 7）
    const def = ws.def;
    player.aimAngle = aim;

    else if (def.type === 'melee_thrust') spearAttack(player, def, aim);
    else if (def.type === 'melee_chain') gauntletAttack(player, def, aim); // 充能拳套：连锁攻击（对既有三武器零影响）
    else if (def.type === 'ranged_multi') bowAttack(player, def, aim);     // 落日神弓：五向箭雨（bow_staff_lifesteal）
    else if (def.type === 'zone_cast') staffAttack(player, def, aim);      // 起源法杖：法阵施法（bow_staff_lifesteal）
    else pistolAttack(player, def, aim);

  }
  /* 刀：近战扇形瞬发判定，当帧一次性遍历全部存活敌人（hp>0 前置过滤） */
  function knifeAttack(p, def, aim) {
    World.addEffect('slash', p.x, p.y, aim, { range: def.range, half: def.arcHalfAngle, color: def.color });
    GAME.AudioSys.play(def.sfx);
    for (const e of World.enemies) {
      if (e.hp > 0 && Utils.sectorHit(p.x, p.y, aim, def.arcHalfAngle, def.range, e.x, e.y, e.radius)) {
        hitEnemy(p, def, e);
      }
    }
    const b = World.boss;
    if (b && b.hp > 0 && b.state !== 'spawn' && Utils.sectorHit(p.x, p.y, aim, def.arcHalfAngle, def.range, b.x, b.y, b.radius)) {

    }
  }
  /* 长枪：轴向投影矩形判定 + 命中敌人附加击退初速（Boss 免疫击退） */
  function spearAttack(p, def, aim) {
    World.addEffect('thrust', p.x, p.y, aim, { range: def.range, width: def.thrustWidth, color: def.color });
    GAME.AudioSys.play(def.sfx);
    for (const e of World.enemies) {
      if (e.hp > 0 && Utils.rectHit(p.x, p.y, aim, def.range, def.thrustWidth / 2, e.x, e.y, e.radius)) {
        const killed = hitEnemy(p, def, e);

    }

  function pistolAttack(p, def, aim) {

  function gauntletAttack(p, def, aim) {

    World.addEffect('punch', p.x, p.y, aim, { range: def.range, half: def.arcHalfAngle, color: def.color });
    GAME.AudioSys.play(def.sfx);
    /* 双持判定（一次性，决策 D7）：两槽均为拳套 → 连锁上限 ×dualChainMultiplier（5→10），

    const maxTargets = def.chainMaxTargets * (dual ? def.dualChainMultiplier : 1);

  function lifestealHeal(p) {

  }
  /* 灼烧施加与刷新（bow_staff_lifesteal D10）：burnT 恒置满（刷新语义，强度不变）+
     burnTickT 重置 interval（首次施加与重复施加均为"重新点燃"——神弓冷却 1.0s > 跳间隔 0.5s，
     重置不会推迟首跳）；参数读 CONFIG.weapons.bow（施加来源唯一，spec 5.3.1 规则 5）；
     刷新分支同帧迸发 refreshSparkCount 粒火星（design 2.5.2 F，计入全局帧预算） */
  function applyBurn(target) {
    const bdef = CONFIG.weapons.bow;
    const refresh = target.burnT > 0;
    target.burnT = bdef.burnDuration;
    target.burnTickT = bdef.burnInterval;
    if (refresh) {
      World.spawnParticles(target.x, target.y, 'burnSpark', CONFIG.fx.burn.refreshSparkCount, 60, { vy: -30 });
    }
  }
  /* 灼烧逐帧结算（bow_staff_lifesteal D2/D9，接口组二）：遍历 enemies 与 boss 对 burnT > 0 实体——
     ① 双计时递减；② burnTickT 归零结算一跳：固定伤害 burnDps × burnInterval（配置派生，不走
     rollDamage/rollInstantKill——不吃攻击系数/暴击/秒杀，spec 5.3.1 规则 2 定稿）+ burn 橙色浮字
     + 吸血钩子（灼烧为玩家来源伤害，spec 5.6.1 规则 6a）+ 跳伤火星 + 周期续推；
     ③ burnT 归零自然到期：发射灰烬粒子（熄灭余灰，design 2.5.2 E）；
     ④ 跳结算致死：灰烬主导死亡反馈（火星 + ashDeathMul 倍灰烬），死亡统一交 World.cull（掉落全联动）；
     ⑤ 持续火焰粒子：每 flameInterval 一批定向锥上飘（D18 opts），受全局帧预算钳制（design 2.5.2 G——
     预算内按遍历序先到先得，超预算实体本帧跳过发射仅保留罩染外环；信息层火星/灰烬不降级） */
  function updateBurn(dt, player) {
    const bdef = CONFIG.weapons.bow;
    const fxc = CONFIG.fx.burn;
    const tickDmg = bdef.burnDps * bdef.burnInterval; // 配置派生固定跳伤（40 × 0.5 = 20）
    const budget = GAME.Input.isTouchDevice ? fxc.budgetL : fxc.budgetH;
    let emitted = 0; // 本帧已发射火焰粒子量（预算计数）
    /* 档位批量读取（函数级常量，循环内零重复属性读取） */
    const flameInterval = fxc.flameInterval;
    const flameCount = GAME.Input.isTouchDevice ? fxc.flameCountL : fxc.flameCountH;
    const now = performance.now();
    function burnEntity(t) {
      if (t.burnT <= 0) return;
      const wasAlive = t.hp > 0;
      t.burnT -= dt;
      t.burnTickT -= dt;
      /* 跳结算（周期续推：一次 dt 跨多跳时循环追平，防大帧丢跳；
         条件不含 burnT > 0——t=3.0s 边界帧 burnT 与 burnTickT 同时归零时仍结算第 6 跳，保证"3 秒恰 6 跳"） */
      while (t.burnTickT <= 0 && t.hp > 0) {
        t.burnTickT += bdef.burnInterval;
        t.hp -= tickDmg;
        World.spawnFloatText(t.x, t.y - t.radius - 4, String(Math.round(tickDmg)), 'burn');
        World.spawnParticles(t.x, t.y, 'burnSpark', fxc.sparkCount, fxc.sparkPower, { vy: -30 });
        lifestealOnDamage(player, tickDmg);
        if (t.hp <= 0) { // 灼烧致死：灰烬主导死亡反馈（2 倍灰烬 + 火星，design 2.5.2 E）
          World.spawnParticles(t.x, t.y, 'burnAsh', fxc.ashCount * fxc.ashDeathMul, 50, { vy: -fxc.ashRise, sizeMul: fxc.ashSizeMul, lifeMul: 0.9 });
          World.spawnParticles(t.x, t.y, 'burnSpark', fxc.sparkCount, fxc.sparkPower, { vy: -30 });
          GAME.AudioSys.play('burnTick');
          return;
        }
        GAME.AudioSys.play('burnTick'); // 经既有 60ms 同名节流防多目标爆音
      }
      /* 自然到期：熄灭灰烬（"燃烧熄灭"干脆语义，无渐隐残留） */
      if (t.burnT <= 0) {
        t.burnT = 0; t.burnTickT = 0;
        World.spawnParticles(t.x, t.y, 'burnAsh', fxc.ashCount, 40, { vy: -fxc.ashRise, sizeMul: fxc.ashSizeMul });
        return;
      }
      /* 持续火焰粒子（预算内发射；死亡实体 hp ≤ 0 时跳过——同帧致死由致死分支的灰烬接管） */
      if (t.hp > 0 && emitted < budget) {
        /* 发射节流：performance.now() 时间片取模近似间隔控制（无需逐实体累计字段，design 2.5.2 G 字段最小化；
           双重取模归一防屏外负坐标实体相位为负导致的每帧误发射） */
        const phase = ((now * 0.001 + t.x * 0.01) % flameInterval + flameInterval) % flameInterval;
        if (phase < dt || flameInterval <= dt) {
          const ox = Utils.rand(-t.radius * 0.6, t.radius * 0.6);
          const oy = Utils.rand(-t.radius * 0.6, t.radius * 0.6);
          /* 双色随机 + 每 3 粒 1 粒火星点缀（红→橙→黄观感渐变，design 2.5.2 C） */
          for (let i = 0; i < flameCount && emitted < budget; i++) {
            const key = (i + Math.floor(now * 0.001 * 13)) % 3 === 0 ? 'burnSpark' :
              (Math.random() < 0.5 ? 'burnFlameA' : 'burnFlameB');
            World.spawnParticles(t.x + ox, t.y + oy, key, 1, fxc.flamePower,
              { vy: -fxc.flameRise, lifeMul: fxc.flameLifeMul, sizeMul: fxc.flameSizeMul });
            emitted++;
          }
        }
      }
    }
    for (const e of World.enemies) burnEntity(e);
    const b = World.boss;
    if (b && b.hp > 0) burnEntity(b);
  }
  /* 法阵倒计时与爆发结算（bow_staff_lifesteal D3/D8，接口组二）：倒序遍历（swap-remove 友好）——
     ① 预警期 t > 0 仅递减不结算（敌人可走入/走出，spec 5.4.1 规则 3a）；
     ② t ≤ 0 爆发当帧原子完成：伤害基数 = baseDamage + staffGrowth（爆发时刻最新成长值，D8），
        范围判定 distSq ≤ (radius + 目标半径)²，逐目标 hitEnemy/hitBoss（source 缺省 'player'——
        暴击/秒杀/吸血全联动，spec 5.4.1 规则 6a）；③ 成长记账 min(N × growthRate, cap - staffGrowth)
        一次性累加（封顶钳制，双持不抬上限）+ 成长浮字 + 紫白小粒子迸发 + staffGrow 音效；
     ④ 空范围空结算正常完成且同样走完整爆发视觉（spec 4.2.6）；⑤ 爆发特效 + 屏震 + 当帧移除 */
  function updateZones(dt, player) {
    const zones = World.zones;
    for (let i = zones.length - 1; i >= 0; i--) {
      const z = zones[i];
      z.t -= dt;
      if (z.t > 0) continue; // 预警期
      /* 爆发结算（当帧原子完成） */
      const sdef = CONFIG.weapons.staff;
      const base = z.baseDamage + player.staffGrowth; // 爆发时刻最新成长值（D8）
      const zoneDef = { damage: base, sfx: 'hit' };   // 伪 def 先例：rollDamage 只消费 damage 字段
      let hits = 0;
      for (const e of World.enemies) {
        if (e.hp > 0) {
          const rr = z.radius + e.radius;
          if (Utils.distSq(z.x, z.y, e.x, e.y) <= rr * rr) {
            hitEnemy(player, zoneDef, e); // source 缺省 'player' → 吸血联动
            hits++;
          }
        }
      }
      const bs = World.boss;
      if (bs && bs.hp > 0 && bs.state !== 'spawn') {
        const rr = z.radius + bs.radius;
        if (Utils.distSq(z.x, z.y, bs.x, bs.y) <= rr * rr) {
          hitBoss(player, zoneDef, bs);
          hits++;
        }
      }
      /* 成长记账：命中数 > 0 时一次累加（封顶钳制）+ 反馈（D14：成长浮字承担反馈，不同步 refreshWeapons） */
      if (hits > 0) {
        const grow = Math.min(hits * z.growthRate, sdef.growthCap - player.staffGrowth);
        if (grow > 0) {
          player.staffGrowth += grow;
          World.spawnFloatText(z.x, z.y - z.radius - 8, '法杖 +' + grow, 'heal');
          World.spawnParticles(z.x, z.y, 'zoneBurst', CONFIG.fx.staffSparkCount, CONFIG.fx.staffSparkPower);
          GAME.AudioSys.play('staffGrow');
        }
      }
      /* 爆发视觉：burst 冲击环 + burstAfter 余韵 + 22 粒迸发 + 屏震（空爆发同样完整反馈，spec 4.2.6） */
      World.addEffect('burst', z.x, z.y, 0, { radius: z.radius });
      World.addEffect('burstAfter', z.x, z.y, 0, { radius: z.radius });
      World.spawnParticles(z.x, z.y, 'zoneBurst', CONFIG.fx.burstParticles, CONFIG.fx.burstParticlePower);
      GAME.Render.shake(CONFIG.fx.burstShake);
      GAME.AudioSys.play('staffBurst');
      zones[i] = zones[zones.length - 1]; zones.pop(); // 当帧 swap-remove（禁止残留二次判定，spec 5.4.1 规则 11a）
    }
  }
  /* 暴击结算：每次命中独立 roll，伤害 = 武器伤害 × 攻击系数 × (暴击 ? 倍率 : 1)，向下取整 */
  function rollDamage(player, def) {
    const isCrit = Math.random() < player.critRate;
    const dmg = Math.floor(def.damage * player.atkMul * (isCrit ? CONFIG.combat.critMultiplier : 1));
    return { dmg: dmg, isCrit: isCrit };
  }
  /* 秒杀判定 roll：优先级高于暴击（spec 5.3.1 规则 2）——命中入口先调本函数，成功则短路全部常规结算；
     P ≤ 0 直接短路返回 false（未获得增益时仅一次数值比较，零随机数开销，spec 4.1.2 常数开销红线）；
     对 Boss 触发概率减半：chance = P × bossRateFactor（决策 C v2，spec 5.3.1 规则 3） */
  function rollInstantKill(player, isBossTarget) {
    const p = player.instantKillRate;
    if (p <= 0) return false;
    const chance = isBossTarget ? p * CONFIG.drops.instantKill.bossRateFactor : p;
    return Math.random() < chance;
  }
  /* 敌人受击：秒杀分支（第 1 优先级）→ 常规扣血 + 闪白 + 伤害数字 + 音效（死亡结算统一在 World.cull）
     返回 true 表示本次命中已致死（秒杀），调用方可据此跳过击退等后续动作
     第 4 参 source（bow_staff_lifesteal D6，缺省 'player'）：伤害来源——'mate' 队友子弹不触发吸血增益
     （spec 5.6.1 规则 6）；普通敌人秒杀分支无结算值不挂吸血（spec 5.6.3 场景 3）；既有调用零改动 */
  function hitEnemy(player, def, e, source) {
    if (rollInstantKill(player, false)) {
      /* 秒杀：hp 归零，由 World.cull 同帧统一走既有死亡结算（粒子/击杀数/小掉落/音效/屏震零新增代码） */
      e.hp = 0;
      World.spawnFloatText(e.x, e.y - e.radius - 4, '秒杀', 'ikill');
      GAME.AudioSys.play('ikill');
      return true;
    }
    const r = rollDamage(player, def);
    e.hp -= r.dmg;
    e.hitFlashT = CONFIG.fx.hitFlash;
    World.spawnFloatText(e.x, e.y - e.radius - 4, String(r.dmg), r.isCrit);
    GAME.AudioSys.play('hit');
    if (source !== 'mate' && player.lifestealRate > 0) lifestealOnDamage(player, r.dmg);
    return false;
  }
  /* Boss 受击：秒杀分支（先查冷却再 roll 概率——冷却期内完全跳过随机数生成）→ 常规扣血 + 实体震动
     秒杀对 Boss = 减半概率触发 + 最大生命 5% 固定伤害 + 2 秒冷却（决策 C v2 三要点，spec 5.3.1 规则 3）
     第 4 参 source 同 hitEnemy：秒杀固定伤害为实际结算值 → 触发吸血（spec 5.6.1 规则 6）；常规路径同挂 */
  function hitBoss(player, def, b, source) {
    const ik = CONFIG.drops.instantKill;
    if (player.instantKillRate > 0 && b.ikCd <= 0 && rollInstantKill(player, true)) {
      const dmg = Math.ceil(b.maxHp * ik.bossDamageRatio); // 5% 最大生命固定伤害（向上取整保证低血 Boss 也有伤害）
      b.hp -= dmg;
      b.shakeT = CONFIG.boss.hitShakeTime; // 沿用既有受击震动
      b.ikCd = ik.bossCooldown;            // 触发成功才进入 2.0s 冷却
      World.spawnFloatText(b.x, b.y - b.radius - 6, '秒杀 -' + dmg, 'ikill');
      GAME.AudioSys.play('ikill');
      if (source !== 'mate' && player.lifestealRate > 0) lifestealOnDamage(player, dmg); // 实际结算值触发吸血
      return; // 短路本次命中的暴击与常规结算（hp ≤ 0 由 cull 走正常 Boss 死亡链）
    }
    const r = rollDamage(player, def);
    b.hp -= r.dmg;
    b.shakeT = CONFIG.boss.hitShakeTime;
    World.spawnFloatText(b.x, b.y - b.radius - 6, String(r.dmg), r.isCrit);
    GAME.AudioSys.play('bossHit');
    if (source !== 'mate' && player.lifestealRate > 0) lifestealOnDamage(player, r.dmg);
  }
  /* 子弹更新：飞行 + 出界回收 + 圆-圆命中判定（按归属分派结算） */
  function updateBullets(dt, player) {
    const R = GAME.Render;
    /* 出屏口径分轨预读（elite_bullet_cull spec 5.2.1 规则 1/4，design 决策 D3）：
       玩家/队友子弹维持既有 60px 余量（覆盖屏缘外 40px 生成入场的敌人，规则 4）；
       敌方子弹按"完全出屏当帧回收"口径——margin 取弹体自身半径（中心出界距离超过半径
       ⟺ 弹体最后一像素离开视口；防错关键：符号为 +b.radius 正数，负数会使弹体大半在屏内即被回收） */
    const marginPlayer = CONFIG.combat.bulletMargin;
    const tightCull = CONFIG.combat.enemyBulletTightCull;
    for (const b of World.bullets) {
      if (!b.active) continue;
      /* 拖尾：环形记录最近 N 帧坐标（扁平数组） */
      b.trail.push(b.x, b.y);
      const maxTrail = CONFIG.fx.trailLength * 2;
      if (b.trail.length > maxTrail) b.trail.splice(0, b.trail.length - maxTrail);
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.life -= dt;
      const m = (tightCull && b.owner === 'enemy') ? b.radius : marginPlayer;
      if (b.life <= 0 || b.x < -m || b.x > R.W + m || b.y < -m || b.y > R.H + m) {
        b.active = false; continue; // 出界/超时回收（出屏先于命中：同帧不再参与命中结算，spec 4.2.2）
      }
      if (b.owner !== 'enemy') {
        /* 玩家/队友子弹 → 敌人 / Boss（mate 子弹同走命中管线：暴击/秒杀/击杀统计/掉落 roll 自动联动）
           source 传 b.owner（bow_staff_lifesteal D6）：'mate' 子弹天然排除吸血增益（spec 5.6.1 规则 6）；
           arrow 样式箭矢命中同帧追加灼烧施加（D10：不依赖本体是否暴击/秒杀，spec 5.2.1 规则 5） */
        let consumed = false;
        for (const e of World.enemies) {
          if (e.hp > 0 && Utils.circleHit(b.x, b.y, b.radius, e.x, e.y, e.radius)) {
            hitEnemy(player, { damage: b.damage, sfx: 'hit' }, e, b.owner);
            if (b.style === 'arrow') applyBurn(e);
            b.active = false; consumed = true; break;
          }
        }
        if (consumed) continue;
        const bs = World.boss;
        if (bs && bs.hp > 0 && bs.state !== 'spawn' && Utils.circleHit(b.x, b.y, b.radius, bs.x, bs.y, bs.radius)) {
          hitBoss(player, { damage: b.damage }, bs, b.owner);
          if (b.style === 'arrow') applyBurn(bs);
          b.active = false;
        }
      } else {
        /* 敌方子弹 → 玩家（无敌帧期间免疫） */
        if (player.hp > 0 && player.invincibleT <= 0 &&
            Utils.circleHit(b.x, b.y, b.radius, player.x, player.y, player.radius)) {
          damagePlayer(player, b.damage);
          b.active = false;
        }
      }
    }
  }
  /* 玩家受伤：无敌帧双重防连扣 + 屏震 + 受伤音效；生命归零触发死亡结算 */
  function damagePlayer(p, dmg) {
    if (p.invincibleT > 0 || p.hp <= 0) return;
    p.hp -= dmg;
    p.invincibleT = CONFIG.player.invincibleTime;
    GAME.AudioSys.play('hurt');
    GAME.Render.shake(CONFIG.shake.hurt);
    World.spawnFloatText(p.x, p.y - p.radius - 6, '-' + Math.round(dmg), false); // 浮字显示取整（消除浮点长尾）；结算层保持浮点精确
    if (p.hp <= 0) { p.hp = 0; GAME.Game.onPlayerDeath(); }
  }
  /* hitEnemy/hitBoss 一并导出：秒杀判定与受击结算的确定性验证入口（测试/调试用）；
     updateZones/updateBurn/lifestealOnDamage：法阵/灼烧每帧结算与吸血结算导出（bow_staff_lifesteal 接口组二/四） */
  return { update: update, tryAttack: tryAttack, updateBullets: updateBullets, damagePlayer: damagePlayer,
    hitEnemy: hitEnemy, hitBoss: hitBoss, updateZones: updateZones, updateBurn: updateBurn, lifestealOnDamage: lifestealOnDamage };
})();

/* ============================================================
 * EnemyAI 模块：四类敌人行为（近战追击 / 远程交战区间 + 周期射击）
 * ============================================================ */
GAME.EnemyAI = (function () {
  const World = GAME.World;

  /* 创建敌人实体：类型模板 × 层数成长曲线（hp/移速/攻频逐层增长） */
  function spawn(defKey, level, x, y, isMinion) {
    if (World.enemies.length >= CONFIG.limits.maxEnemies) return null; // 上限拒绝
    const def = CONFIG.enemies.defs[defKey];
    if (!def) { console.warn('未知敌人类型: ' + defKey); return null; }
    const g = CONFIG.enemies.growth;
    /* 伤害成长倍率（rebalance 新增维度）：×(1+min(0.02N, 1.0))，第 50 层封顶翻倍；
       "有效系数"内联容错——非法配置（非有限正数）归零 → 倍率退化 1 照常生成（spec 4.2.1，防 NaN 污染实体） */
    const dmgMul = 1 + Math.min(
      (typeof g.damagePerLevel === 'number' && isFinite(g.damagePerLevel) && g.damagePerLevel > 0 ? g.damagePerLevel : 0) * level,
      (typeof g.damageCap === 'number' && isFinite(g.damageCap) && g.damageCap > 0 ? g.damageCap : 0));
    const e = {
      def: def, isMinion: !!isMinion, level: level,
      x: x, y: y, radius: def.radius,
      hp: def.hpBase * (1 + g.hpPerLevel * level),
      speed: def.speedBase * (1 + Math.min(g.speedPerLevel * level, g.speedCap)),
      /* 成长后伤害字段（构造期一次性定型，终身不变）：近战接触/远程子弹共用倍率；
         || 0 归一防 undefined×mul=NaN（近战类无 bulletDamage 键、远程类无 touchDamage 键）；
         四类敌人统一字段集与顺序（近战 bulletDamage 落 0 / 远程 touchDamage 落 0），V8 隐藏类稳定 */
      touchDamage: (def.touchDamage || 0) * dmgMul,
      bulletDamage: (def.bulletDamage || 0) * dmgMul,
      shootCd: def.ranged ? def.shootInterval * Utils.rand(0.5, 1.2) : 0, // 随机相位防同步齐射
      touchCd: 0, hitFlashT: 0,
      knockVX: 0, knockVY: 0,
      orbitDir: Math.random() < 0.5 ? 1 : -1, // 远程环绕方向（随机 ±）
      burnT: 0, burnTickT: 0 // 灼烧状态（bow_staff_lifesteal D2：剩余时长 + 跳计时，随实体生灭；四类敌人统一字段集口径延续）
    };
    World.enemies.push(e);
    return e;
  }

  /* 敌人 AI 主循环：近战永远朝玩家追击；远程维持交战区间 + 周期射击 */
  function update(dt, player) {
    const R = GAME.Render;
    const block = CONFIG.combat.enemyOffscreenFireBlock; // 屏外发射抑制开关（函数级预读，循环内零重复属性读取）
    for (const e of World.enemies) {
      if (e.hp <= 0) continue;
      e.hitFlashT -= dt; e.touchCd -= dt;
      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = dx / dist, ny = dy / dist;
      let mvx = 0, mvy = 0;
      if (!e.def.ranged) {
        /* 近战：持续朝玩家移动（入场后永不 idle，spec 5.3.1 规则 8） */
        mvx = nx; mvy = ny;
        /* 接触伤害：重叠且自身攻击间隔到 → 结算（配合玩家无敌帧双重防连扣） */
        if (dist < e.radius + player.radius + 2 && e.touchCd <= 0) {
          e.touchCd = e.def.attackInterval;
          GAME.Combat.damagePlayer(player, e.touchDamage); // 成长后接触伤害（实体字段，rebalance）
        }
      } else {
        const d = e.def;
        if (dist > d.rangeMax) { mvx = nx; mvy = ny; }             // 过远 → 接近
        else if (dist < d.rangeMin) { mvx = -nx; mvy = -ny; }      // 过近 → 后退
        else { mvx = -ny * e.orbitDir * 0.6; mvy = nx * e.orbitDir * 0.6; } // 区间内 → 环绕游走
        /* 射击冷却结束 → 朝玩家发射（精英为 3 连发扇形）；
           开火缓冲追加判定：新关入场后 2.0s 内冷却就绪也不发射，缓冲结束后按既有周期恢复（spec 5.1.1 规则 6）；
           屏外发射抑制（elite_bullet_cull spec 5.2.1 规则 2，design 决策 D4）：发射者中心位于视口内才允许
           发射（置于 && 链末位，屏外敌人常态下零额外求值）——消除屏外冷枪（看不到弹源却挨打），并与出屏
           即逝配套消除"屏外出生当帧即被回收的隐形吞弹"（屏内发射 ⟹ 出生帧必然存活）；
           屏外时冷却保持就绪（不重置），入屏后下一次判定当帧即发射（无悬挂"待发射"中间态，spec 4.2.3） */
        e.shootCd -= dt;
        if (e.shootCd <= 0 && dist < d.rangeMax * 1.25 && GAME.LevelGen.L.fireGraceT <= 0
            && (!block || (e.x >= 0 && e.x <= R.W && e.y >= 0 && e.y <= R.H))) {
          e.shootCd = d.shootInterval / (1 + CONFIG.enemies.growth.fireRatePerLevel * e.level);
          const aimBase = Math.atan2(dy, dx);
          const burst = d.burstCount || 1;
          for (let i = 0; i < burst; i++) {
            const a = aimBase + (i - (burst - 1) / 2) * (d.burstSpread || 0);
            World.spawnBullet('enemy', e.x, e.y, a, d.bulletSpeed, e.bulletDamage, d.bulletRadius, 'enemy', d.bulletLife); // 子弹伤害取成长后实体字段；寿命参数化引用（design D5）
          }
        }
      }
      /* 位移合成（追击/走位 + 击退）与击退指数衰减 */
      e.x += (mvx * e.speed + e.knockVX) * dt;
      e.y += (mvy * e.speed + e.knockVY) * dt;
      const decay = Math.exp(-CONFIG.combat.knockDecay * dt);
      e.knockVX *= decay; e.knockVY *= decay;
      /* 场外缓冲钳制：生成于边界外，朝玩家移动必然入场 */
      const oc = CONFIG.enemies.spawn.outsideClamp;
      e.x = Utils.clamp(e.x, -oc, R.W + oc);
      e.y = Utils.clamp(e.y, -oc, R.H + oc);
    }
    separate();
  }

  /* 轻量分离力：防止敌人叠团；每帧只处理有限对重叠者（O(n²) 截断，性能让位） */
  let sepCursor = 0;
  function separate() {
    const arr = World.enemies, n = arr.length;
    if (n < 2) return;
    let pairs = 0;
    const limit = CONFIG.enemies.spawn.separationPairs;
    for (let k = 0; k < n && pairs < limit; k++) {
      const i = (sepCursor + k) % n; // 轮转起点，避免每帧偏向队首
      const a = arr[i];
      if (a.hp <= 0) continue;
      for (let j = i + 1; j < n && pairs < limit; j++) {
        const b = arr[j];
        if (b.hp <= 0) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.radius + b.radius;
        const dsq = dx * dx + dy * dy;
        if (dsq < rr * rr && dsq > 1e-6) {
          const d = Math.sqrt(dsq);
          const push = (rr - d) * 0.5;
          const ux = dx / d, uy = dy / d;
          a.x -= ux * push; a.y -= uy * push;
          b.x += ux * push; b.y += uy * push;
          pairs++;
        }
      }
    }
    sepCursor = (sepCursor + 1) % n;
  }
  return { spawn: spawn, update: update };
})();

/* ============================================================
 * BossAI 模块：Boss 行为状态机
 * SPAWN(无敌演出) → SEEK(追击+技能计时) → VOLLEY/CHARGE/SUMMON
 *   → COOLDOWN → SEEK 循环；技能防连发 + 序号成长
 * ============================================================ */
GAME.BossAI = (function () {
  const World = GAME.World;

  /* Boss 关生成：bossIndex = level/10，全部属性随序号成长（spec 5.4.1 规则 6） */
  function spawn(level) {
    const cfg = CONFIG.boss;
    const idx = level / 10;
    /* Boss 本体伤害成长（rebalance 新增）：×(1+0.08×(序号-1))，第 1 序号恰为基准值；容错归一同敌人生成 */
    const valid = function (x) { return typeof x === 'number' && isFinite(x) && x > 0 ? x : 0; };
    const touchMul = 1 + valid(cfg.touchDamagePerIndex) * (idx - 1);
    const chargeMul = 1 + valid(cfg.chargeDamagePerIndex) * (idx - 1);
    World.boss = {
      bossIndex: idx, level: level,
      x: GAME.Render.W / 2, y: GAME.Render.H * 0.3,
      radius: cfg.radius,
      hp: cfg.baseHp * Math.pow(idx, cfg.hpExponent),
      maxHp: cfg.baseHp * Math.pow(idx, cfg.hpExponent),
      speed: cfg.speed * (1 + cfg.speedPerIndex * (idx - 1)),
      /* 成长后本体伤害字段（构造期定型）：接触/冲锋；弹幕伤害沿用既有 volleyDamagePerIndex 现算不入实体 */
      touchDamage: cfg.touchDamage * touchMul,
      chargeDamage: cfg.chargeDamage * chargeMul,
      state: 'spawn', stateT: cfg.spawnTime,
      skillTimer: cfg.skillInterval * 0.6, // 首次技能稍快
      lastSkills: [], volleyAngle: 0, chargeAngle: 0, chargeDist: 0, hitPlayer: false,
      shakeT: 0, touchCd: 0, rot: 0, ikCd: 0, // ikCd：秒杀对 Boss 的触发冷却（随 Boss 实体生灭，spec 6.3.3）
      burnT: 0, burnTickT: 0 // 灼烧状态（bow_staff_lifesteal D2：对 Boss 照常生效，spec 5.3.1 规则 4）
    };
    World.spawnParticles(World.boss.x, World.boss.y, 'gold', 20, 180);
    GAME.AudioSys.play('bossWarn');
  }

  /* 技能选择：权重 + 防连发（最近 2 次同类权重 ×0.3，保证多种攻击方式被观察到） */
  function chooseSkill(b, aimAngle) {
    const cfg = CONFIG.boss;
    const skills = ['volley', 'charge', 'summon'];
    const items = skills.map(function (s) {
      return { key: s, weight: b.lastSkills.indexOf(s) >= 0 ? cfg.lastSkillPenalty : 1 };
    });
    const pick = Utils.pickWeighted(items);
    b.lastSkills.push(pick);
    if (b.lastSkills.length > 2) b.lastSkills.shift();
    if (pick === 'volley') { b.state = 'volley'; b.volleyAngle = aimAngle; }
    else if (pick === 'charge') { b.state = 'charge_wind'; b.stateT = cfg.chargeWindup; GAME.AudioSys.play('bossWarn'); }
    else { b.state = 'summon'; }
  }
  function toCooldown(b) {
    const cfg = CONFIG.boss;
    b.state = 'cooldown';
    b.stateT = Math.max(cfg.skillInterval * (1 - cfg.intervalReduce * (b.bossIndex - 1)), cfg.intervalMin);
  }
  /* 召唤小怪落点：场内随机点且与玩家保持安全距离 */
  function minionPos(player) {
    const cfg = CONFIG.boss, R = GAME.Render;
    for (let t = 0; t < 8; t++) {
      const x = Utils.rand(60, R.W - 60), y = Utils.rand(60, R.H - 60);
      if (Utils.distSq(x, y, player.x, player.y) >= cfg.minionSafeDistance * cfg.minionSafeDistance) return { x: x, y: y };
    }
    return { x: Utils.clamp(R.W - player.x, 60, R.W - 60), y: Utils.clamp(R.H - player.y, 60, R.H - 60) };
  }

  function update(dt, player) {
    const b = World.boss;
    if (!b || b.hp <= 0) return;
    const cfg = CONFIG.boss, R = GAME.Render;
    b.shakeT -= dt; b.touchCd -= dt; b.rot += dt * 0.8;
    if (b.ikCd > 0) b.ikCd = Math.max(0, b.ikCd - dt); // 秒杀触发冷却递减（spec 6.2.8）
    const dx = player.x - b.x, dy = player.y - b.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = dx / dist, ny = dy / dist;

    /* Boss 本体接触伤害（追击贴身不至于无伤站撸） */
    if (b.state !== 'spawn' && b.touchCd <= 0 && dist < b.radius + player.radius + 2) {
      b.touchCd = cfg.touchInterval;
      GAME.Combat.damagePlayer(player, b.touchDamage); // 成长后本体接触伤害（实体字段，rebalance）
    }

    switch (b.state) {
      case 'spawn': /* 出生演出：无敌 + 闪烁预警 */
        b.stateT -= dt;
        if (b.stateT <= 0) b.state = 'seek';
        break;
      case 'seek': { /* 追击 + 技能计时 */
        b.x += nx * b.speed * dt;
        b.y += ny * b.speed * dt;
        b.skillTimer -= dt;
        if (b.skillTimer <= 0) chooseSkill(b, Math.atan2(dy, dx));
        break;
      }
      case 'volley': { /* 扇形弹幕：朝锁定方向 ±半角等间隔多发（弹间预留可走位间隙） */
        /* 开火缓冲判定（决策 D12）：缓冲期内跳过本轮弹幕转冷却延迟一轮（技能循环继续）——
           覆盖高序号 Boss 首技能 1.72s < 2.0s 的弹幕窗口，spec 5.1.1 规则 6 对"敌方"全覆盖 */
        if (GAME.LevelGen.L.fireGraceT > 0) { toCooldown(b); break; }
        /* 屏外发射抑制（elite_bullet_cull spec 5.2.1 规则 2a，design 决策 D6）：Boss 中心在视口外时
           本轮弹幕被抑制并转 cooldown 延迟一轮（与缓冲期处理同构，防无限期滞留 volley 态）——
           Boss 现状恒屏内（屏内生成 + 非 spawn 态位置钳制），本判定为视口极端变化等场景的规则完备性兜底 */
        if (CONFIG.combat.enemyOffscreenFireBlock && (b.x < 0 || b.x > R.W || b.y < 0 || b.y > R.H)) {
          toCooldown(b); break;
        }
        const n = Utils.randInt(cfg.volleyMin, cfg.volleyMax);
        const speed = cfg.volleySpeed + cfg.volleySpeedPerIndex * b.bossIndex;
        const dmg = cfg.volleyDamage + cfg.volleyDamagePerIndex * b.bossIndex;
        for (let i = 0; i < n; i++) {
          const a = b.volleyAngle - cfg.volleyHalfAngle + (2 * cfg.volleyHalfAngle) * (i / (n - 1));
          World.spawnBullet('enemy', b.x, b.y, a, speed, dmg, 6, 'boss', cfg.volleyLife); // 弹幕寿命参数化引用（design D5）
        }
        toCooldown(b);
        break;
      }
      case 'charge_wind': /* 冲锋蓄力：停止移动 + 闪烁预警（telegraph 可躲避性保障） */
        b.stateT -= dt;
        if (b.stateT <= 0) {
          b.state = 'charge_dash';
          b.chargeAngle = Math.atan2(dy, dx); // 蓄力结束瞬间锁定方向
          b.chargeDist = cfg.chargeDistance;
          b.hitPlayer = false;
        }
        break;
      case 'charge_dash': { /* 高速冲刺：冲出距离或撞墙即止；命中单次结算防重复扣血 */
        const spd = cfg.chargeSpeed * (1 + cfg.speedPerIndex * (b.bossIndex - 1));
        b.x += Math.cos(b.chargeAngle) * spd * dt;
        b.y += Math.sin(b.chargeAngle) * spd * dt;
        b.chargeDist -= spd * dt;
        if (!b.hitPlayer && player.invincibleT <= 0 &&
            Utils.circleHit(b.x, b.y, b.radius, player.x, player.y, player.radius)) {
          b.hitPlayer = true;
          GAME.Combat.damagePlayer(player, b.chargeDamage); // 成长后冲锋伤害（实体字段，rebalance）
          /* 冲锋击退：沿冲刺方向把玩家位置直推一小段（钳制场内） */
          player.x = Utils.clamp(player.x + Math.cos(b.chargeAngle) * 40, player.radius, R.W - player.radius);
          player.y = Utils.clamp(player.y + Math.sin(b.chargeAngle) * 40, player.radius, R.H - player.radius);
        }
        if (b.chargeDist <= 0 || b.x < b.radius || b.x > R.W - b.radius || b.y < b.radius || b.y > R.H - b.radius) {
          toCooldown(b);
        }
        break;
      }
      case 'summon': { /* 召唤快速近战小怪（isMinion 标记，计入本关清关条件） */
        const count = cfg.summonBase + b.bossIndex;
        for (let i = 0; i < count; i++) {
          const pos = minionPos(player);
          GAME.EnemyAI.spawn(cfg.minionTypeSafe || 'melee_fast', b.level, pos.x, pos.y, true);
        }
        toCooldown(b);
        break;
      }
      case 'cooldown': /* 技能冷却：缓慢游走，随后重回追击 */
        b.stateT -= dt;
        b.x += nx * b.speed * 0.3 * dt;
        b.y += ny * b.speed * 0.3 * dt;
        if (b.stateT <= 0) {
          b.state = 'seek';
          b.skillTimer = Math.max(cfg.skillInterval * (1 - cfg.intervalReduce * (b.bossIndex - 1)), cfg.intervalMin) * 0.6;
        }
        break;
    }
    /* 位置钳制（spawn 演出期间不钳制） */
    if (b.state !== 'spawn') {
      b.x = Utils.clamp(b.x, b.radius, R.W - b.radius);
      b.y = Utils.clamp(b.y, b.radius, R.H - b.radius);
    }
  }
  return { spawn: spawn, update: update };
})();

/* ============================================================
 * LevelGen 模块：关卡生成（成长曲线 + 四边生成 + 分批入场 + 清关检测）
 * ============================================================ */
GAME.LevelGen = (function () {
  const L = { level: 0, pendingQueue: [], spawnTimer: 0, fireGraceT: 0 };

  function reset() { L.level = 0; L.pendingQueue.length = 0; L.spawnTimer = 0; L.fireGraceT = 0; }

  /* 开启新关卡：Boss 关只生成 Boss + "Boss 来袭"提示；普通关构造波次 */
  function startLevel(level, player) {
    L.level = level;
    L.pendingQueue.length = 0;
    L.spawnTimer = 0;
    /* 开火缓冲启动（决策 D3）：置于 Boss 关提前 return 之前——普通关与 Boss 关统一生效；
       缓冲期内敌方禁止发射新子弹（仅约束发射，不约束移动，spec 5.1.1 规则 6） */
    L.fireGraceT = CONFIG.combat.fireGraceTime;
    if (level % 10 === 0) {
      GAME.BossAI.spawn(level);
      GAME.UI.showToast('Boss 来袭', 'boss');
      return;
    }
    GAME.UI.showToast('第 ' + level + ' 关', 'level');
    buildWave(level, player);
  }

  /* 类型组成权重随层数演化（elite_bullet_cull 修订后构成，design 决策 D1/D2）：
     第 1~4 关普通近战 → 第 5 关起混入快速近战 → 第 8 关起纯近战压制（普通远程已配置驱动下线：
     mix.rangedNormal = Infinity 使下方判定恒为 false，逻辑零改动）→ 第 10 关 Boss 关不执行本函数
     → 第 11 关起精英远程混入（弹幕常态化）；ranged_normal 份额由剩余类型按既有权重自然承接 */
  function rollType(level) {
    const m = CONFIG.enemies.mix;
    const items = [{ key: 'melee_normal', weight: 1 }];
    if (level >= m.fast) items.push({ key: 'melee_fast', weight: 0.5 });
    if (level >= m.rangedNormal) items.push({ key: 'ranged_normal', weight: 0.45 });
    if (level >= m.rangedElite) items.push({ key: 'ranged_elite', weight: 0.25 });
    return Utils.pickWeighted(items);
  }

  /* 四边外随机生成：上/下/左/右均匀分配，边外偏移；与玩家过近则重选（最多 3 次） */
  function spawnPos(player) {
    const cfg = CONFIG.enemies.spawn, R = GAME.Render;
    for (let t = 0; t <= cfg.retries; t++) {
      const edge = Utils.randInt(0, 3);
      let x, y;
      if (edge === 0) { x = Utils.rand(0, R.W); y = -cfg.offset; }
      else if (edge === 1) { x = Utils.rand(0, R.W); y = R.H + cfg.offset; }
      else if (edge === 2) { x = -cfg.offset; y = Utils.rand(0, R.H); }
      else { x = R.W + cfg.offset; y = Utils.rand(0, R.H); }
      if (Utils.distSq(x, y, player.x, player.y) >= cfg.safeDistance * cfg.safeDistance) return { x: x, y: y };
    }
    /* 重选均失败：取玩家中心对称点（该场景内离玩家最远）兜底 */
    return { x: Utils.clamp(R.W - player.x, 0, R.W), y: Utils.clamp(R.H - player.y, 0, R.H) };
  }

  /* 波次构造：数量按成长曲线；首批立即入场，其余进待生成队列分批涌入 */
  function buildWave(level, player) {
    const g = CONFIG.enemies.growth;
    const count = Math.min(Math.floor(g.countBase + level * g.countPerLevel), CONFIG.limits.maxEnemies);
    const initial = Math.max(1, Math.floor(count * CONFIG.enemies.spawn.initialRatio));
    for (let i = 0; i < count; i++) {
      const defKey = rollType(level);
      const pos = spawnPos(player);
      if (i < initial) GAME.EnemyAI.spawn(defKey, level, pos.x, pos.y, false);
      else L.pendingQueue.push({ defKey: defKey, level: level, x: pos.x, y: pos.y });
    }
  }

  /* 每帧：分批补投队列 + 清关检测（场上敌人 + 队列 + Boss 全空 → 通知推进） */
  function tick(dt, player) {
    L.fireGraceT = Math.max(0, L.fireGraceT - dt); // 帧首递减（供 EnemyAI/BossAI 当帧只读；界面冻结期间 tick 停摆、缓冲暂停递减）
    if (L.pendingQueue.length > 0) {
      L.spawnTimer -= dt;
      if (L.spawnTimer <= 0 && GAME.World.enemies.length < CONFIG.limits.maxEnemies) {
        L.spawnTimer = CONFIG.enemies.spawn.interval;
        let batch = Utils.randInt(1, CONFIG.enemies.spawn.batchMax);
        while (batch > 0 && L.pendingQueue.length > 0 && GAME.World.enemies.length < CONFIG.limits.maxEnemies) {
          const q = L.pendingQueue.shift();
          if (!GAME.EnemyAI.spawn(q.defKey, q.level, q.x, q.y, false)) {
            L.pendingQueue.unshift(q); // 容量满则留在队首下次再试
            break;
          }
          batch--;
        }
      }
    }
    if (GAME.World.enemies.length === 0 && L.pendingQueue.length === 0 && !GAME.World.boss) {
      GAME.Game.onLevelClear(); // 清关事件（Game 侧状态守卫防重复推进）
    }
  }
  return { L: L, reset: reset, startLevel: startLevel, tick: tick };
})();

/* ============================================================
 * DropBuff 模块：掉落判定 / 拾取吸附 / 增益生效（全量重算 + 软上限）
 * ============================================================ */
GAME.DropBuff = (function () {
  const World = GAME.World;
  /* 模块级缓存：常规增益类型列表（过滤 rare 标记，秒杀只出现在选择界面候选池，design §三.4 裁决） */
  const commonBuffTypes = Object.keys(CONFIG.drops.buffs).filter(function (t) { return !CONFIG.drops.buffs[t].rare; });

  /* 软上限判定（单一真值源）：候选剔除与增益栏上限标注共用，消除重复 if-else 链 */
  function isBuffCapped(player, type) {
    const caps = CONFIG.drops.caps;
    if (type === 'atk') return player.atkMul >= caps.atk;
    if (type === 'aspd') return player.aspdMul >= caps.aspd;
    if (type === 'speed') return player.speedMul >= caps.speed;
    if (type === 'crit') return player.critRate >= caps.crit;
    if (type === 'pickup') return player.pickupRadius >= caps.pickup;
    if (type === 'instantKill') return player.instantKillRate >= caps.instantKill;
    if (type === 'lifesteal') return player.lifestealRate >= caps.lifesteal; // 吸血软上限 30%（bow_staff_lifesteal spec 5.6.1 规则 5）
    if (type === 'maxhp' || type === 'regen') return false; // 无软上限
    console.warn('未知增益类型: ' + type);
    return false;
  }

  /* 候选权重：秒杀/吸血按池取稀有权重（rare 模式），其余取定义权重或缺省基准 100（spec 6.2.3-5） */
  function weightOf(type, kind) {
    const choice = CONFIG.drops.choice;
    if (type === 'instantKill') {
      return kind === 'boss' ? choice.instantKillWeightBoss : choice.instantKillWeightNormal;
    }
    if (type === 'lifesteal') { // 吸血权重 8/10（bow_staff_lifesteal spec 5.6.1 规则 4，rare 同构先例）
      return kind === 'boss' ? choice.lifestealWeightBoss : choice.lifestealWeightNormal;
    }
    return CONFIG.drops.buffs[type].weight || choice.baseWeight;
  }

  /* 候选生成（design §2.3 四步算法，spec 5.4.1）：
     ① 建池（达软上限者剔除暂存） ② 权重合法性兜底 ③ 不放回加权抽取（互不重复）
     ④ 池枯竭时由被剔除项均匀回补并标记 isCapped；返回长度恒等于配置候选数 */
  function rollCandidates(player, kind) {
    const choice = CONFIG.drops.choice;
    const count = kind === 'boss' ? choice.bossCount : choice.normalCount;
    const pool = [], cappedPool = [];
    for (const type in CONFIG.drops.buffs) {
      const def = CONFIG.drops.buffs[type];
      if (!def || def.type !== type) continue;
      if (choice.excludeCapped && isBuffCapped(player, type)) cappedPool.push(type);
      else pool.push(type);
    }
    /* ② 权重兜底：任一权重非有限正数或总权重 ≤ 0 时改走均匀抽取（spec 4.2.1 容错，流程不中断） */
    let total = 0, bad = false;
    for (const t of pool) {
      const w = weightOf(t, kind);
      if (!isFinite(w) || w <= 0) { bad = true; break; }
      total += w;
    }
    const result = [];
    /* ③ 不放回加权抽取：抽中即移出池，保证候选互不重复（spec 5.4.1 规则 2/3） */
    while (result.length < count && pool.length > 0) {
      let idx = -1;
      if (bad || total <= 0) {
        idx = Utils.randInt(0, pool.length - 1); // 均匀兜底抽取
      } else {
        const items = pool.map(function (t) { return { key: t, weight: weightOf(t, kind) }; });
        const pick = Utils.pickWeighted(items);
        idx = pool.indexOf(pick);
      }
      result.push({ type: pool[idx], isCapped: false });
      pool.splice(idx, 1);
    }
    /* ④ 池枯竭回补：由被剔除的达上限项均匀随机补足（spec 5.4.3 场景 1，选择后数值钳制不变） */
    while (result.length < count && cappedPool.length > 0) {
      const idx = Utils.randInt(0, cappedPool.length - 1);
      result.push({ type: cappedPool[idx], isCapped: true });
      cappedPool.splice(idx, 1);
    }
    return result;
  }

  /* 普通敌人死亡多路独立掉落判定：既有增益 / 经验球 / 血包三路各自独立随机数 roll，
     任一命中不影响其他判定（spec 4.2.4 掉落判定独立）；多路命中时生成位置以死亡点为中心
